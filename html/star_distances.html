<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="dark">
<title>Star Distances — PHYS 320</title>
<style>
  :root{
    --background:#050607;
    --rail:#171a1f;
    --canvas:#0d1015;
    --panel-deep:#151a20;
    --panel:#202328;
    --panel-raised:#292d32;
    --border:#3b4046;
    --border-strong:#4a5057;
    --border-hover:#69717a;
    --text:#e7e9eb;
    --muted:#979ea6;
    --cyan:#56c7d9;
    --magenta:#ee65be;
    --purple:#a99bff;
    --amber:#ffcc66;
    --green:#56dc72;
    --coral:#ff7f66;
    --on-accent:#0c181b;
    --control-hover:#343a41;
    --cyan-wash: rgb(86 199 217/10%);
    --cyan-border: rgb(86 199 217/55%);
    --black-shadow: rgb(0 0 0/25%);
    --black-shadow-soft: rgb(0 0 0/13%);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; width:100%; overflow-x:hidden; }
  body{
    margin:0;
    background:var(--background);
    color:var(--text);
    font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:13px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  .math{ font-family:"STIX Two Math","Cambria Math","Times New Roman",serif; font-style:italic; }
  .tabular{ font-variant-numeric:tabular-nums; }

  button, input, select{ font-family:inherit; }

  /* ---------- app shell ---------- */
  #app{ height:100dvh; width:100%; display:grid; grid-template-rows:44px 1fr; overflow:hidden; }

  .topbar{
    grid-row:1; display:flex; align-items:center; justify-content:space-between;
    gap:12px; height:44px; padding:0 12px;
    background:var(--rail); border-bottom:1px solid var(--border);
    min-width:0; overflow:hidden;
  }
  .brand{ display:flex; align-items:center; gap:8px; min-width:0; flex:0 1 auto; text-decoration:none; color:inherit; border-radius:4px; }
  .brand:hover .brand-title{ color:var(--cyan); }
  .brand:hover .brand-sub{ text-decoration:underline; }
  .brand-icon{ flex:0 0 auto; filter:drop-shadow(0 0 5px rgb(86 199 217/28%)); }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
  .brand-title{ font-size:15px; font-weight:700; letter-spacing:.02em; white-space:nowrap; }
  .brand-sub{ font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .tabbar{ flex:0 1 auto; min-width:0; max-width:100%; overflow-x:auto; scrollbar-width:thin; }
  .tabbar::-webkit-scrollbar{ height:4px; }
  .tabbar::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:2px; }

  .segmented{
    display:inline-flex; align-items:stretch;
    border:1px solid var(--border); border-radius:6px; overflow:hidden;
    background:var(--panel-raised); white-space:nowrap;
  }
  .segmented button{
    appearance:none; border:none; border-right:1px solid var(--border);
    background:transparent; color:var(--text);
    font-size:12px; min-height:28px; padding:0 12px; cursor:pointer; white-space:nowrap;
    transition:background .12s ease, color .12s ease;
  }
  .segmented button:last-child{ border-right:none; }
  .segmented button:hover{ background:var(--control-hover); }
  .segmented button.active{ background:var(--cyan); color:var(--on-accent); font-weight:600; }
  .segmented button:disabled{ opacity:.45; cursor:default; }

  /* ---------- body / rail / workspace ---------- */
  .body{
    grid-row:2; display:grid;
    grid-template-columns: var(--rail-w, 300px) 6px minmax(0,1fr);
    min-height:0; min-width:0;
  }

  .rail{
    background:var(--rail); border-right:1px solid var(--border);
    overflow-y:auto; overflow-x:hidden;
    display:flex; flex-direction:column; gap:8px; padding:10px; min-width:0;
  }

  .workspace{
    min-width:0; min-height:0; padding:10px;
    display:grid; grid-template-rows:minmax(0,1fr) 6px var(--strip-h, 190px); gap:0;
    background:radial-gradient(circle at 50% 45%, var(--panel-deep) 0%, var(--canvas) 60%, var(--background) 100%);
  }

  /* ---------- movable splitters ---------- */
  .splitter{ position:relative; background:transparent; z-index:2; touch-action:none; }
  .splitter::after{
    content:""; position:absolute; background:var(--cyan); opacity:0; border-radius:2px;
    transition:opacity .12s ease;
  }
  .splitter:hover::after, .splitter.dragging::after, .splitter:focus-visible::after{ opacity:.4; }
  .v-splitter{ cursor:col-resize; }
  .v-splitter::after{ top:0; bottom:0; left:2px; width:2px; }
  .h-splitter{ cursor:row-resize; margin:8px 0; }
  .h-splitter::after{ left:0; right:0; top:2px; height:2px; }
  body.resizing-col, body.resizing-col *{ cursor:col-resize !important; user-select:none !important; }
  body.resizing-row, body.resizing-row *{ cursor:row-resize !important; user-select:none !important; }

  .card{
    border-radius:6px; border:1px solid var(--border); background:var(--panel);
    box-shadow:0 5px 18px var(--black-shadow-soft); padding:10px; flex:0 0 auto; min-width:0;
  }
  .eyebrow{ font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }

  /* ---------- canvas panels ---------- */
  .main-row{ display:flex; gap:8px; min-width:0; min-height:0; }
  .main-row > .panel{ min-width:0; }
  #panelA{ flex:6 1 0; }
  #panelB{ flex:4 1 0; }

  .panel{
    border-radius:6px; border:1px solid var(--border); background:var(--canvas);
    box-shadow:0 5px 18px var(--black-shadow-soft);
    display:flex; flex-direction:column; overflow:hidden; min-height:0; min-width:0;
  }
  .panel-header{
    height:34px; flex:0 0 34px; display:flex; align-items:center; justify-content:space-between;
    padding:0 10px; background:var(--panel-deep); border-bottom:1px solid var(--border);
    gap:10px; overflow:hidden;
  }
  .panel-title{ font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .panel-readouts{ display:flex; align-items:center; gap:10px; font-size:11.5px; color:var(--muted); white-space:nowrap; flex:0 0 auto; overflow:hidden; text-overflow:ellipsis; }
  .panel-readouts b{ color:var(--text); font-weight:600; }
  .panel-header-right{ display:flex; align-items:center; gap:8px; flex:0 0 auto; margin-left:auto; }
  .icon-btn{ min-width:28px; padding:0 8px; font-size:13px; line-height:1; }
  .panel-caption{
    flex:0 0 auto; font-size:11px; line-height:1.35; color:var(--muted);
    padding:5px 10px; background:var(--panel-deep); border-bottom:1px solid var(--border);
    transition:color .3s ease;
  }
  .panel-caption.truescale{ color:var(--amber); }
  .panel-body{ flex:1 1 auto; min-height:0; min-width:0; position:relative; }
  .panel-body canvas{ display:block; width:100%; height:100%; }
  #canvasA{ touch-action:none; cursor:grab; }
  #canvasA:active{ cursor:grabbing; }
  .zoom-badge{
    position:absolute; right:8px; bottom:8px; z-index:3;
    font-size:10px; color:var(--muted); background:color-mix(in srgb, var(--panel-deep) 85%, transparent);
    border:1px solid var(--border); border-radius:4px; padding:2px 6px;
    pointer-events:none; font-variant-numeric:tabular-nums;
  }

  .swatch{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:middle; }

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    min-height:28px; padding:0 10px; color:var(--text); background:var(--panel-raised);
    border:1px solid var(--border); border-radius:4px; font-size:12px; cursor:pointer;
    transition:background .12s ease, border-color .12s ease;
  }
  .btn:hover{ background:var(--control-hover); border-color:var(--border-hover); }
  .btn:disabled{ opacity:.45; cursor:default; }
  .btn-prominent{
    width:100%; justify-content:center; margin-bottom:10px; font-weight:600;
    color:var(--cyan); background:var(--cyan-wash); border-color:var(--cyan-border);
  }
  .btn-prominent:hover{ background:color-mix(in srgb, var(--cyan) 18%, var(--panel-raised)); }

  /* ---------- transport (playback) ---------- */
  .transport{ width:100%; margin-bottom:10px; }
  .transport button{ flex:1 1 0; }

  /* ---------- slider + number fields ---------- */
  .field{ margin-bottom:10px; }
  .field:last-child{ margin-bottom:0; }
  .field-label{ display:block; font-size:11px; color:var(--muted); margin-bottom:5px; }
  .field-label .math{ color:var(--text); font-size:12px; }
  .field-row{ display:flex; align-items:center; gap:8px; min-width:0; }
  .field-row.between{ justify-content:space-between; }
  input[type=range]{ flex:1 1 auto; min-width:0; accent-color:var(--cyan); height:22px; background:transparent; }
  .num-input{
    width:64px; flex:0 0 auto; min-height:28px; background:var(--panel-raised);
    border:1px solid var(--border); border-radius:4px; color:var(--text);
    padding:4px 7px; font:inherit; font-variant-numeric:tabular-nums; text-align:right;
  }
  .unit{ flex:0 0 auto; font-size:11px; color:var(--muted); }

  select{
    width:100%; min-height:28px; background:var(--panel-raised);
    border:1px solid var(--border); border-radius:4px; color:var(--text);
    padding:4px 7px; font:inherit;
  }
  input:disabled, select:disabled{ opacity:.45; cursor:default; }

  /* ---------- toggles (display card) ---------- */
  .toggle{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    width:100%; min-height:28px; padding:0 10px; margin-bottom:6px;
    background:var(--panel-raised); border:1px solid var(--border); border-radius:4px;
    color:var(--text); font-size:12px; cursor:pointer;
    transition:background .12s ease, border-color .12s ease;
  }
  .toggle:last-child{ margin-bottom:0; }
  .toggle:hover{ background:var(--control-hover); border-color:var(--border-hover); }
  .toggle .dot{ width:8px; height:8px; border-radius:50%; background:var(--border-strong); flex:0 0 auto; }
  .toggle[aria-pressed="true"]{ background:var(--cyan); color:var(--on-accent); border-color:var(--cyan); font-weight:600; }
  .toggle[aria-pressed="true"] .dot{ background:var(--on-accent); }

  /* ---------- formulas (living in the strip panel) ---------- */
  .formula-line{ margin-bottom:10px; }
  .formula-line:last-child{ margin-bottom:0; }
  .formula-def{ font-size:12.5px; margin-bottom:3px; }
  .formula-sub{ font-size:11.5px; color:var(--muted); word-break:break-word; }
  .formula-sub b{ color:var(--text); font-weight:600; }
  .ktx{ display:none; }
  .katex{ font-size:1.05em; color:inherit; }
  .katex-display{ margin:6px 0; text-align:left; overflow-x:auto; overflow-y:hidden; }
  .formula-note{ font-size:11.5px; color:var(--muted); }
  .formula-def .formula-note{ margin-top:2px; display:block; }
  .formula-sub .formula-note{ margin-left:4px; }

  /* ---------- strip panel: formula lines laid out as wrapping columns (matches two_body.html) ---------- */
  #stripBody{
    position:absolute; inset:0; overflow:auto; box-sizing:border-box;
    padding:10px 16px; display:flex; flex-wrap:wrap; align-content:flex-start;
    gap:6px 18px;
  }
  #stripBody .formula-line{ flex:1 1 190px; max-width:260px; min-width:170px; margin-bottom:0; }
  #stripBody .katex-display{ margin:4px 0; }

  /* ---------- notice / lecture-link card ---------- */
  .notice-list{ margin:0; padding-left:16px; }
  .notice-list li{ margin-bottom:6px; font-size:12px; color:var(--text); }
  .notice-list li:last-child{ margin-bottom:8px; }
  .lecture-link{ font-size:11px; color:var(--muted); font-style:italic; padding-top:6px; border-top:1px solid var(--border); }
  .reminder{ font-size:11px; color:var(--muted); font-style:italic; margin:8px 0 0; }

  /* ---------- instrument card ---------- */
  .instr-row{
    display:grid; grid-template-columns:1fr auto auto 18px; gap:8px; align-items:center;
    padding:4px 0; border-bottom:1px solid var(--border); font-size:11px;
  }
  .instr-row:last-child{ border-bottom:none; }
  .instr-row.instr-header{ color:var(--muted); font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; padding-bottom:6px; }
  .instr-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .instr-val{ color:var(--text); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .instr-check{ text-align:center; font-weight:700; }
  .instr-check.yes{ color:var(--green); }
  .instr-check.no{ color:var(--coral); }

  :focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    /* .body switches from a 2D grid to a plain stacking flex column here:
       a CSS-grid auto row, in a definite-height container whose content
       overflows it, does NOT grow past the container the way one might
       expect -- it gets compressed, so the workspace and rail can end up
       overlapping. A flex column with flex:0 0 auto on both children (see
       below) always sizes each to its natural content height instead, and
       #app/.body switch to auto-height so the whole page scrolls normally. */
    #app{ height:auto; min-height:100dvh; grid-template-rows:44px auto; overflow:visible; }
    .body{
      grid-template-columns:1fr; display:flex; flex-direction:column;
      height:auto; overflow-y:visible;
    }
    .rail{
      order:2; border-right:none; border-top:1px solid var(--border);
      display:grid; grid-template-columns:1fr 1fr; gap:8px; align-content:start;
      overflow-y:visible; flex:0 0 auto;
    }
    .workspace{ order:1; grid-template-rows:clamp(480px, 130vw, 720px) 220px; gap:8px; flex:0 0 auto; }
    .splitter{ display:none; }
    .main-row{ flex-direction:column; }
    #panelA{ flex:1 1 auto; min-height:260px; }
    #panelB{ flex:1 1 auto; min-height:200px; }
  }
  @media (max-width:560px){
    .rail{ grid-template-columns:1fr; }
  }
  @media (max-width:480px){
    .brand-sub{ display:none; }
    .panel-title{ font-size:11px; }
    .panel-readouts{ font-size:10px; gap:6px; }
    .panel-header{ padding:0 8px; }
  }

  /* ---------- embed mode (?embed=1): diagram only, no chrome ---------- */
  body.embed .topbar,
  body.embed .rail,
  body.embed .splitter,
  body.embed #stripPanel,
  body.embed .panel-header,
  body.embed .panel-caption,
  body.embed .drag-hint{ display:none; }
  body.embed #app{ grid-template-rows:1fr; }
  body.embed .body{ grid-template-columns:1fr; }
  body.embed .workspace{ padding:0; grid-template-rows:1fr; }
  body.embed #mainRow{ width:100vw; height:100vh; }
  body.embed #mainRow .panel{ border:none; border-radius:0; box-shadow:none; }
</style>

<script>
(function(){
"use strict";

/* =========================================================================
   1. CONSTANTS / UNITS
   ========================================================================= */
const TAU = Math.PI * 2;
const DEG = 180 / Math.PI;
const RAD = Math.PI / 180;
const YEAR_DAYS = 365.25;
const PC_AU = 206265;      // 1 pc = 206265 AU (definition of the parsec)
const PC_LY = 3.262;       // 1 pc in light-years
const PC_KM = 3.086e13;    // 1 pc in km
const TAB_ORDER = ["parallax","magnitudes"];

function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
const COLORS = {};
function loadColors(){
  ["background","rail","canvas","panel-deep","panel","panel-raised","border",
   "border-strong","border-hover","text","muted","cyan","magenta","purple",
   "amber","green","on-accent","coral"].forEach(function(n){ COLORS[n] = cssVar("--"+n); });
}
function hexToRgb(hex){
  hex = hex.replace("#","");
  if(hex.length===3){ hex = hex.split("").map(function(c){ return c+c; }).join(""); }
  const num = parseInt(hex,16);
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function hexAlpha(hex, a){ const c = hexToRgb(hex); return "rgba("+c.r+","+c.g+","+c.b+","+a+")"; }

function clamp(v,lo,hi){ return Math.min(hi, Math.max(lo, v)); }
function lerp(a,b,t){ return a + (b-a)*t; }
function decimalsFromStep(step){
  const s = String(step);
  const i = s.indexOf(".");
  return i<0 ? 0 : (s.length - i - 1);
}
function fmtNum(v, step){ return Number(v).toFixed(decimalsFromStep(step)); }

// Format an angle given in arcsec, auto-switching to milliarcsec below 0.1".
function fmtArcsec(p){
  const ap = Math.abs(p);
  if(ap >= 0.1) return p.toFixed(4) + "″";
  if(ap >= 0.0001) return (p*1000).toFixed(2) + " mas";
  return (p*1e6).toFixed(1) + " µas";
}
// Format a distance given in parsecs, auto-switching to kpc above 1000 pc.
function fmtParsec(d){
  if(d >= 1000) return (d/1000).toFixed(d>=10000?1:2) + " kpc";
  if(d >= 10) return d.toFixed(1) + " pc";
  return d.toFixed(3) + " pc";
}
// Same as fmtParsec but with trailing zeros trimmed (used in the compact instrument table).
function fmtParsecShort(d){
  if(d >= 1000) return trimZeros((d/1000).toFixed(2)) + " kpc";
  if(d >= 10) return trimZeros(d.toFixed(1)) + " pc";
  return trimZeros(d.toFixed(3)) + " pc";
}
function fmtScientific(v, sig){
  if(v === 0) return "0";
  const s = v.toExponential(sig==null?1:sig);
  const parts = s.split("e");
  const exp = parseInt(parts[1],10);
  return parts[0] + "&times;10<sup>" + exp + "</sup>";
}
// Plain-text (no markup) scientific notation, for textContent-only readouts.
function fmtSciPlain(v, sig){
  if(v === 0) return "0";
  return v.toExponential(sig==null?2:sig).replace("e+","e");
}
// LaTeX scientific notation ("7.20\times10^{5}"), for embedding in KaTeX strings.
function sciLatex(v, sig){
  if(v === 0) return "0";
  const s = v.toExponential(sig==null?3:sig);
  const parts = s.split("e");
  const exp = parseInt(parts[1],10);
  return parts[0] + "\\times10^{" + exp + "}";
}

/* =========================================================================
   1b. KATEX TYPESETTING (vendored, offline -- vendor/katex/, loaded via
       <script defer> in <head>). Mirrors kepler_laws.html verbatim: every
       .ktx target starts hidden and its .ktx-fallback sibling (plain HTML
       already in the markup) stands in until a render call flips them, so
       the page still teaches correctly if KaTeX failed to load.
   ========================================================================= */
function katexReady(){ return !!(window.katex && typeof window.katex.render === "function"); }
const _katexSig = new WeakMap();
function katexInto(ktxEl, fallbackEl, latex, displayMode){
  if(!ktxEl) return;
  if(!katexReady()){
    ktxEl.style.display = "none";
    if(fallbackEl) fallbackEl.style.display = "";
    return;
  }
  const sig = (displayMode ? "D:" : "I:") + latex;
  if(_katexSig.get(ktxEl) !== sig){
    try{
      window.katex.render(latex, ktxEl, { throwOnError:false, displayMode: !!displayMode });
      _katexSig.set(ktxEl, sig);
    }catch(e){
      ktxEl.style.display = "none";
      if(fallbackEl) fallbackEl.style.display = "";
      return;
    }
  }
  ktxEl.style.display = "block";
  if(fallbackEl) fallbackEl.style.display = "none";
}
function renderMathSpans(root){
  if(!root || !katexReady()) return;
  root.querySelectorAll("[data-latex]").forEach(function(el){
    try{ window.katex.render(el.dataset.latex, el, { throwOnError:false, displayMode:false }); }
    catch(e){ /* leave the original glyph content on error */ }
  });
}

/* pre-rendered radial glow sprite -- drawImage instead of shadowBlur (cheaper on the GPU) */
function makeGlowSprite(colorHex, cssSize){
  const dpr = window.devicePixelRatio || 1;
  const size = Math.max(2, Math.round(cssSize*dpr));
  const c = document.createElement("canvas");
  c.width = size; c.height = size;
  const gctx = c.getContext("2d");
  const rgb = hexToRgb(colorHex);
  const grad = gctx.createRadialGradient(size/2,size/2,0, size/2,size/2, size/2);
  grad.addColorStop(0, "rgba("+rgb.r+","+rgb.g+","+rgb.b+",0.85)");
  grad.addColorStop(0.5, "rgba("+rgb.r+","+rgb.g+","+rgb.b+",0.35)");
  grad.addColorStop(1, "rgba("+rgb.r+","+rgb.g+","+rgb.b+",0)");
  gctx.fillStyle = grad;
  gctx.beginPath(); gctx.arc(size/2,size/2,size/2,0,TAU); gctx.fill();
  return { canvas:c, cssSize:cssSize };
}
function drawGlow(ctx, sprite, x, y, destSize){
  const s = destSize || sprite.cssSize;
  ctx.drawImage(sprite.canvas, x-s/2, y-s/2, s, s);
}

/* =========================================================================
   2. PHYSICS  (pure functions -- everything recomputed fresh from t/params)
   ========================================================================= */

// Earth's ecliptic longitude at day-of-year t (degrees, CCW), and the Sun's
// apparent geocentric longitude (always 180 deg opposite Earth).
function earthLongitudeDeg(t){ return ((t/YEAR_DAYS)*360) % 360; }
function sunApparentLongitudeDeg(t){ return (earthLongitudeDeg(t) + 180) % 360; }

// Parallax angle (arcsec, HALF-angle) for a star at true distance d (pc).
function parallaxArcsec(d){ return 1/d; }
function distanceFromParallax(pArcsec){ return 1/pArcsec; }

// Apparent displacement of the star on the sky (arcsec), star at ecliptic
// longitude 0 and latitude beta (deg); lamSunApp is the Sun's apparent
// longitude (deg) at the current date. Returns the two independent
// components actually used for drawing: dLambdaCosBeta (the great-circle
// displacement along the ecliptic-longitude direction -- well defined even
// at beta = 90, where "delta-lambda" alone is not) and dBeta.
function parallaxDisplacement(d, betaDeg, lamSunApp){
  const p = parallaxArcsec(d);
  const diff = (lamSunApp - 0) * RAD; // lambda* = 0 by construction
  const beta = betaDeg * RAD;
  return {
    p: p,
    dLambdaCosBeta: p * Math.sin(diff),
    dBeta: -p * Math.sin(beta) * Math.cos(diff)
  };
}

// Magnitudes: m = M + 5 log10(d/10pc) + A_V ; flux ratio via Pogson's relation.
function apparentMag(M, dPc, Av){ return M + 5*Math.log10(dPc/10) + Av; }
function distanceFromMag(m, M, Av){ return 10 * Math.pow(10, (m - M - Av)/5); }
function fluxRatio(m1, m2){ return Math.pow(100, (m2-m1)/5); } // F1/F2
function combinedMag(ma, mb){
  const Fa = Math.pow(10, -0.4*ma), Fb = Math.pow(10, -0.4*mb);
  return -2.5*Math.log10(Fa+Fb);
}
const VEGA_M = 0.03;
function logFluxRelVega(m){ return -0.4*(m - VEGA_M); }

// Small seeded RNG (mulberry32) so the sky panel's background star field is
// fixed/reproducible instead of re-randomizing on every resize/redraw.
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const BG_STARS = (function(){
  const rnd = mulberry32(20260903);
  const n = 150, out = new Array(n);
  for(let i=0;i<n;i++){
    out[i] = { rx: rnd(), ry: rnd(), r: 0.5 + rnd()*1.4, a: 0.25 + rnd()*0.55 };
  }
  return out;
})();

// Linear slider + numeric input pair, two-way synced (verbatim contract from
// the reference pages' buildSliderField).
function buildSliderField(container, opts){
  const field = document.createElement("div");
  field.className = "field";
  const label = document.createElement("label");
  label.className = "field-label";
  label.innerHTML = opts.label;
  const row = document.createElement("div");
  row.className = "field-row";
  const range = document.createElement("input");
  range.type = "range"; range.min = opts.min; range.max = opts.max; range.step = opts.step;
  range.value = opts.value;
  const num = document.createElement("input");
  num.type = "number"; num.className = "num-input";
  num.min = opts.min; num.max = opts.max; num.step = opts.step;
  num.value = fmtNum(opts.value, opts.step);
  function commit(v){ opts.onChange(v); }
  range.addEventListener("input", function(){
    const v = parseFloat(range.value);
    num.value = fmtNum(v, opts.step);
    commit(v);
  });
  num.addEventListener("input", function(){
    const v = parseFloat(num.value);
    if(!isNaN(v)){ range.value = clamp(v, opts.min, opts.max); commit(v); }
  });
  num.addEventListener("blur", function(){
    let v = parseFloat(num.value);
    if(isNaN(v)) v = opts.value;
    v = clamp(v, opts.min, opts.max);
    num.value = fmtNum(v, opts.step);
    range.value = v;
    commit(v);
  });
  row.appendChild(range); row.appendChild(num);
  if(opts.unit){
    const unit = document.createElement("span");
    unit.className = "unit";
    unit.textContent = opts.unit;
    row.appendChild(unit);
  }
  field.appendChild(label); field.appendChild(row);
  container.appendChild(field);
  return { field:field, range:range, num:num };
}

// Log-scale slider: the <input type=range> stays linear internally (0..steps)
// and is mapped through log10 to the real value, so drag resolution stays
// even across several decades (0.5 pc .. 10 kpc, 1 pc .. 100 kpc). Same
// two-way-sync contract as buildSliderField (range/num/field returned).
function buildLogSliderField(container, opts){
  const steps = opts.steps || 1000;
  const logMin = Math.log10(opts.min), logMax = Math.log10(opts.max);
  function valToSlider(v){ return Math.round(steps*(Math.log10(clamp(v,opts.min,opts.max))-logMin)/(logMax-logMin)); }
  function sliderToVal(s){ return Math.pow(10, logMin + (s/steps)*(logMax-logMin)); }
  function fmtVal(v){ return opts.fmt ? opts.fmt(v) : (v>=100 ? v.toFixed(0) : v>=10 ? v.toFixed(1) : v.toFixed(3)); }
  const field = document.createElement("div");
  field.className = "field";
  const label = document.createElement("label");
  label.className = "field-label";
  label.innerHTML = opts.label;
  const row = document.createElement("div");
  row.className = "field-row";
  const range = document.createElement("input");
  range.type = "range"; range.min = 0; range.max = steps; range.step = 1;
  range.value = valToSlider(opts.value);
  const num = document.createElement("input");
  num.type = "number"; num.className = "num-input";
  num.min = opts.min; num.max = opts.max; num.step = opts.numStep || "any";
  num.value = fmtVal(opts.value);
  function commit(v){ opts.onChange(v); }
  range.addEventListener("input", function(){
    const v = sliderToVal(parseFloat(range.value));
    num.value = fmtVal(v);
    commit(v);
  });
  num.addEventListener("input", function(){
    const v = parseFloat(num.value);
    if(!isNaN(v) && v>0){ range.value = valToSlider(v); commit(clamp(v,opts.min,opts.max)); }
  });
  num.addEventListener("blur", function(){
    let v = parseFloat(num.value);
    if(isNaN(v) || v<=0) v = opts.value;
    v = clamp(v, opts.min, opts.max);
    num.value = fmtVal(v);
    range.value = valToSlider(v);
    commit(v);
  });
  row.appendChild(range); row.appendChild(num);
  if(opts.unit){
    const unit = document.createElement("span");
    unit.className = "unit";
    unit.textContent = opts.unit;
    row.appendChild(unit);
  }
  field.appendChild(label); field.appendChild(row);
  container.appendChild(field);
  return { field:field, range:range, num:num, setValue:function(v){ range.value=valToSlider(v); num.value=fmtVal(v); } };
}

function buildPresetSelect(container, presets, opts){
  const field = document.createElement("div");
  field.className = "field";
  const label = document.createElement("label");
  label.className = "field-label";
  label.textContent = "Preset";
  const select = document.createElement("select");
  presets.forEach(function(p){
    const opt = document.createElement("option");
    opt.value = p.key; opt.textContent = p.name;
    select.appendChild(opt);
  });
  const customOpt = document.createElement("option");
  customOpt.value = "custom"; customOpt.textContent = "Custom";
  select.appendChild(customOpt);
  select.value = opts.value;
  select.addEventListener("change", function(){ opts.onChange(select.value); });
  field.appendChild(label); field.appendChild(select);
  container.appendChild(field);
  return select;
}

function buildToggleButton(container, key, label){
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "toggle";
  btn.dataset.key = key;
  btn.setAttribute("aria-pressed", state.display[key] ? "true" : "false");
  btn.innerHTML = "<span>"+label+"</span><span class=\"dot\"></span>";
  container.appendChild(btn);
  return btn;
}
function wireDisplayToggles(){
  els.displayFields.addEventListener("click", function(ev){
    const btn = ev.target.closest(".toggle");
    if(!btn) return;
    const key = btn.dataset.key;
    state.display[key] = !state.display[key];
    btn.setAttribute("aria-pressed", state.display[key] ? "true" : "false");
    render();
  });
}

function startLoop(){ if(rafId == null){ lastFrameTs = null; rafId = requestAnimationFrame(loop); } }
function stopLoop(){ if(rafId != null){ cancelAnimationFrame(rafId); rafId = null; } }
const MAX_FRAME_DT = 1/30;
const DAYS_PER_SEC_AT_SPEED1 = YEAR_DAYS/12; // "speed 1x" = one year every 12 seconds

  if(lastFrameTs == null) lastFrameTs = ts;
  const dtSec = (ts - lastFrameTs) / 1000;
  lastFrameTs = ts;
  if(dtSec > 0){
    state.t += state.speed * DAYS_PER_SEC_AT_SPEED1 * Math.min(dtSec, MAX_FRAME_DT);
  }
  render();
  rafId = requestAnimationFrame(loop);
}

/* =========================================================================

   ========================================================================= */
let railWidth = 300, stripPanelHeight = 190;
function applyRailWidth(px){
  railWidth = clamp(px, 230, 420);
  document.querySelector(".body").style.setProperty("--rail-w", railWidth+"px");
}
function applyStripHeight(px){
  stripPanelHeight = clamp(px, 120, 320);
  document.querySelector(".workspace").style.setProperty("--strip-h", stripPanelHeight+"px");
}
function setupSplitter(el, opts){
  let dragging = false, startPos = 0, startSize = 0, activePointerId = null;
  let pendingPos = null, rafScheduled = false;
  function updateAria(){
    el.setAttribute("aria-valuemin", String(opts.min));
    el.setAttribute("aria-valuemax", String(opts.max));
    el.setAttribute("aria-valuenow", String(Math.round(opts.getSize())));
  }
  updateAria();
  function applyPending(){
    rafScheduled = false;
    if(pendingPos == null) return;
    const pos = pendingPos; pendingPos = null;
    let delta = pos - startPos;
    if(opts.invert) delta = -delta;
    opts.setSize(clamp(startSize + delta, opts.min, opts.max));
    updateAria();
  }
  function scheduleApply(pos){
    pendingPos = pos;
    if(!rafScheduled){ rafScheduled = true; requestAnimationFrame(applyPending); }
  }
  function endDrag(){
    const wasDragging = dragging;
    dragging = false;
    pendingPos = null;
    if(activePointerId != null){
      try{ el.releasePointerCapture(activePointerId); }catch(e){}
      activePointerId = null;
    }
    el.classList.remove("dragging");
    document.body.classList.remove("resizing-col");
    document.body.classList.remove("resizing-row");
  }
  el.addEventListener("pointerdown", function(ev){
    if(ev.button !== 0 && ev.pointerType !== "touch" && ev.pointerType !== "pen") return;
    dragging = true;
    activePointerId = ev.pointerId;
    try{ el.setPointerCapture(ev.pointerId); }catch(e){}
    startPos = opts.axis === "x" ? ev.clientX : ev.clientY;
    startSize = opts.getSize();
    el.classList.add("dragging");
    document.body.classList.add(opts.axis === "x" ? "resizing-col" : "resizing-row");
    ev.preventDefault();
  });
  el.addEventListener("pointermove", function(ev){
    if(!dragging) return;
    scheduleApply(opts.axis === "x" ? ev.clientX : ev.clientY);
  });
  el.addEventListener("pointerup", endDrag);
  el.addEventListener("pointercancel", endDrag);
  el.addEventListener("lostpointercapture", endDrag);
  window.addEventListener("pointerup", endDrag, true);
  window.addEventListener("blur", endDrag);
  el.addEventListener("keydown", function(ev){
    const step = 10;
    let dirKey = null;
    if(opts.axis === "x"){
      if(ev.key === "ArrowLeft") dirKey = -1; else if(ev.key === "ArrowRight") dirKey = 1;
    } else {
      if(ev.key === "ArrowUp") dirKey = -1; else if(ev.key === "ArrowDown") dirKey = 1;
    }
    if(dirKey === null) return;
    ev.preventDefault();
    const signedStep = opts.invert ? -dirKey*step : dirKey*step;
    opts.setSize(clamp(opts.getSize() + signedStep, opts.min, opts.max));
    updateAria();
  });
}
function wireSplitters(){
  const vSplitter = document.getElementById("vSplitter");
  const hSplitter = document.getElementById("hSplitter");
  setupSplitter(vSplitter, { axis:"x", invert:false, min:230, max:420, getSize:function(){ return railWidth; }, setSize:applyRailWidth });
  setupSplitter(hSplitter, { axis:"y", invert:true, min:120, max:320, getSize:function(){ return stripPanelHeight; }, setSize:applyStripHeight });

/* =========================================================================
   14. 3D OBLIQUE PROJECTION (Parallax tab main stage)
   Camera at azimuth/elevation around the ecliptic-plane scene; a plain
   orthographic (not perspective) projection, since this is a schematic
   diagram, not a rendering. project3D() is LINEAR (projects a direction /
   vector, not a scaled point) so callers multiply by whatever pixel radius
   applies to that particular vector (orbit radius, star drawing distance).
   ========================================================================= */
const VIEW_ZOOM_MIN = 0.3, VIEW_ZOOM_MAX = 4;
const VIEW_AZ_MIN = -95, VIEW_AZ_MAX = 25, VIEW_EL_MIN = 10, VIEW_EL_MAX = 80;
function resetView(){ state.view.az = -35; state.view.el = 28; state.view.zoom = 1; }
function project3D(v){
  const azr = state.view.az*RAD, elr = state.view.el*RAD;
  const cosA=Math.cos(azr), sinA=Math.sin(azr), cosE=Math.cos(elr), sinE=Math.sin(elr);
  const rx=-sinA, ry=cosA, rz=0;              // screen "right" axis
  const ux=-cosA*sinE, uy=-sinA*sinE, uz=cosE; // screen "up" axis
  const sx = v.x*rx + v.y*ry + v.z*rz;
  const su = v.x*ux + v.y*uy + v.z*uz;
  return { x: sx, y: -su };
}
function updateZoomBadge(){
  const el = els.zoomBadgeA;
  if(!el) return;
  if(state.tab !== "parallax"){ el.hidden = true; return; }
  const z = state.view.zoom;
  if(Math.abs(z-1) < 0.001){ el.hidden = true; return; }
  el.hidden = false;
  el.textContent = "×" + z.toFixed(1);
}
function wireCanvasAView(){
  const canvas = els.canvasA;
  canvas.addEventListener("wheel", function(ev){
    if(state.tab !== "parallax") return;
    ev.preventDefault();
    const factor = ev.deltaY < 0 ? 1.1 : 1/1.1;
    state.view.zoom = clamp(state.view.zoom*factor, VIEW_ZOOM_MIN, VIEW_ZOOM_MAX);
    render();
  }, { passive:false });

  let drag = null;
  canvas.addEventListener("pointerdown", function(ev){
    if(state.tab !== "parallax" || ev.button !== 0) return;
    drag = { id:ev.pointerId, x0:ev.clientX, y0:ev.clientY, az0:state.view.az, el0:state.view.el };
    try{ canvas.setPointerCapture(ev.pointerId); }catch(e){}
  });
  canvas.addEventListener("pointermove", function(ev){
    if(!drag || ev.pointerId !== drag.id) return;
    state.view.az = clamp(drag.az0 + (ev.clientX-drag.x0)*0.3, VIEW_AZ_MIN, VIEW_AZ_MAX);
    state.view.el = clamp(drag.el0 - (ev.clientY-drag.y0)*0.3, VIEW_EL_MIN, VIEW_EL_MAX);
    render();
  });
  function endDrag(ev){
    if(drag && (!ev || ev.pointerId === drag.id)){
      try{ canvas.releasePointerCapture(drag.id); }catch(e){}
      drag = null;
    }
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("lostpointercapture", endDrag);
  canvas.addEventListener("dblclick", function(){ if(state.tab==="parallax"){ resetView(); render(); } });
  els.btnResetView.addEventListener("click", function(){ resetView(); render(); });
}

function outwardDir(sx, sy, cx, cy){
  let vx = sx - cx, vy = sy - cy;
  const len = Math.hypot(vx, vy);
  if(len < 1e-6) return { dx:0, dy:-1 };
  return { dx: vx/len, dy: vy/len };
}
function drawLabel(ctx, sx, sy, text, dir, opts){
  if(!labelsOn()) return;
  opts = opts || {};
  const color = opts.color || COLORS.text;
  const size = opts.size || 11;
  const italic = opts.italic ? "italic " : "";
  ctx.font = italic + size + "px Inter, sans-serif";
  const offset = opts.offset || 11;
  const x = sx + dir.dx * offset;
  const y = sy + dir.dy * offset;
  ctx.textAlign = dir.dx > 0.15 ? "left" : (dir.dx < -0.15 ? "right" : "center");
  ctx.textBaseline = dir.dy > 0.15 ? "top" : (dir.dy < -0.15 ? "bottom" : "middle");
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}
// Compute the same on-canvas box drawLabel() would fill, without drawing it --
// used to detect label/label collisions before committing to draw one of them.
function labelBounds(ctx, sx, sy, text, dir, opts){
  opts = opts || {};
  const size = opts.size || 11;
  const italic = opts.italic ? "italic " : "";
  ctx.font = italic + size + "px Inter, sans-serif";
  const offset = opts.offset || 11;
  const x = sx + dir.dx * offset, y = sy + dir.dy * offset;
  const tw = ctx.measureText(text).width, th = size*1.25;
  const left  = dir.dx > 0.15 ? x : (dir.dx < -0.15 ? x-tw : x-tw/2);
  const top   = dir.dy > 0.15 ? y : (dir.dy < -0.15 ? y-th : y-th/2);
  return { left:left, right:left+tw, top:top, bottom:top+th };
}
function boxesOverlap(a, b){
  return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
}
// Does the segment p0->p1 pass through the axis-aligned box? (Liang-Barsky clip test)
// A label that reads OUTWARD along a radial direction (rotated to match it) instead
// of the usual axis-aligned left/right/top/bottom placement -- needed for the wedge's
// angle label, where a narrow wedge leaves very little axis-aligned clearance between
// its two bounding lines close to the vertex, but plenty of clearance along the
// bisector itself once the text is aligned with it. Text is kept upright (never drawn
// upside down) by flipping the rotation 180 deg, and correspondingly which end of the
// text sits at the anchor, whenever the direction points into the left half-plane.
function radialLabelLayout(dirAngle, tw){
  let rot = dirAngle;
  while(rot > Math.PI) rot -= TAU;
  while(rot <= -Math.PI) rot += TAU;
  const flip = (rot > Math.PI/2 || rot < -Math.PI/2);
  if(flip) rot += Math.PI;
  return { rot:rot, flip:flip };
}
function drawRadialLabel(ctx, x, y, text, dirAngle, size, color){
  if(!labelsOn()) return;
  const lay = radialLabelLayout(dirAngle, 0);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(lay.rot);
  ctx.font = size + "px Inter, sans-serif";
  ctx.textAlign = lay.flip ? "right" : "left";
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.fillText(text, 0, 0);
  ctx.restore();
}
// Axis-aligned bounding box of a drawRadialLabel's occupied pixels (a conservative
// approximation for the overlap/priority-cascade tests: real overlap always implies
// AABB overlap, though not strictly the reverse).
// Does the segment p0->p1 pass through the axis-aligned box? (Liang-Barsky clip test)
function segIntersectsBox(p0, p1, box){
  const dx = p1.x-p0.x, dy = p1.y-p0.y;
  let t0 = 0, t1 = 1;
  const checks = [[-dx, p0.x-box.left], [dx, box.right-p0.x], [-dy, p0.y-box.top], [dy, box.bottom-p0.y]];
  for(let k=0;k<4;k++){
    const p = checks[k][0], q = checks[k][1];
    if(p === 0){ if(q < 0) return false; continue; }
    const r = q/p;
    if(p < 0){ if(r > t1) return false; if(r > t0) t0 = r; }
    else { if(r < t0) return false; if(r < t1) t1 = r; }
  }
  return t0 <= t1;
}
function radialLabelBounds(ctx, x, y, text, dirAngle, size){
  ctx.font = size + "px Inter, sans-serif";
  const tw = ctx.measureText(text).width, th = size*1.25;
  const lay = radialLabelLayout(dirAngle, tw);
  const cosR = Math.cos(lay.rot), sinR = Math.sin(lay.rot);
  // textAlign="right" (flip) draws into local x in [-tw,0] (ending AT the anchor);
  // textAlign="left" (no flip) draws into [0,tw] (starting AT the anchor) -- the
  // occupied local rect has to track which one drawRadialLabel actually used, or
  // this box ends up bounding the wrong side (back toward the vertex) instead of
  // outward along the true direction.
  const x0 = lay.flip ? -tw : 0, x1 = lay.flip ? 0 : tw;
  const corners = [ {x:x0,y:-th/2}, {x:x1,y:-th/2}, {x:x1,y:th/2}, {x:x0,y:th/2} ];
  let left=Infinity, right=-Infinity, top=Infinity, bottom=-Infinity;
  corners.forEach(function(c){
    const wx = x + c.x*cosR - c.y*sinR, wy = y + c.x*sinR + c.y*cosR;
    if(wx<left) left=wx; if(wx>right) right=wx;
    if(wy<top) top=wy; if(wy>bottom) bottom=wy;
  });
  return { left:left, right:right, top:top, bottom:bottom };
}
function drawDimensionLine(ctx, from, to, label, colorHex){
  ctx.save();
  ctx.strokeStyle = hexAlpha(colorHex, 0.8); ctx.fillStyle = hexAlpha(colorHex, 0.9);
  ctx.lineWidth = 1;
  const ang = Math.atan2(to.y-from.y, to.x-from.x);
  const perp = ang + Math.PI/2, cap = 4;
  ctx.beginPath();
  ctx.moveTo(from.x+Math.cos(perp)*cap, from.y+Math.sin(perp)*cap);
  ctx.lineTo(from.x-Math.cos(perp)*cap, from.y-Math.sin(perp)*cap);
  ctx.moveTo(to.x+Math.cos(perp)*cap, to.y+Math.sin(perp)*cap);
  ctx.lineTo(to.x-Math.cos(perp)*cap, to.y-Math.sin(perp)*cap);
  ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y);
  ctx.stroke();
  ctx.restore();
  if(label){
    const mx=(from.x+to.x)/2, my=(from.y+to.y)/2;
    drawLabel(ctx, mx, my, label, outwardDir(mx,my-14,mx,my), { color:colorHex, size:10.5, offset:0 });
  }
}
// Fading "comet-tail" arc, angEnd back to angEnd-sweep, brightest at the head.
function drawFadingArc(ctx, toScreenFn, angEnd, sweep, colorHex, maxAlpha, segments){
  segments = segments || 60;
  if(sweep <= 0) return;
  for(let i=0;i<segments;i++){
    const t0=i/segments, t1=(i+1)/segments;
    const a0 = angEnd - sweep*(1-t0), a1 = angEnd - sweep*(1-t1);
    const p0 = toScreenFn(a0), p1 = toScreenFn(a1);
    ctx.strokeStyle = hexAlpha(colorHex, maxAlpha*Math.pow(t1,1.3));
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
  }
}
function trimZeros(s){ return s.replace(/(\.\d*?)0+$/,"$1").replace(/\.$/,""); }
// Short label for the sky panel's scale bar ("1″", "0.1″", "10 mas", ...).
function fmtArcsecShort(v){
  const ap = Math.abs(v);
  if(ap >= 1) return trimZeros(v.toFixed(ap>=10?0:1)) + "″";
  if(ap >= 0.1) return trimZeros(v.toFixed(2)) + "″";
  if(ap >= 0.0001) return trimZeros((v*1000).toFixed(1)) + " mas";
  return trimZeros((v*1e6).toFixed(1)) + " μas";
}
// Pick a "nice" {1,2,5}x10^n arcsec length whose pixel width is close to a
// fixed fraction of the panel, for the sky panel's scale bar.
function niceScaleLength(pxPerArcsec, panelWidth){
  const targetArcsec = (panelWidth*0.22)/pxPerArcsec;
  const exp = Math.floor(Math.log10(Math.max(targetArcsec,1e-12)));
  const base = targetArcsec/Math.pow(10,exp);
  const nice = base<1.5 ? 1 : base<3.5 ? 2 : base<7.5 ? 5 : 10;
  const arcsec = nice*Math.pow(10,exp);
  return { arcsec:arcsec, px:arcsec*pxPerArcsec, label:fmtArcsecShort(arcsec) };
}

/* =========================================================================
   16. PARALLAX TAB -- MAIN STAGE (3D geometry, canvasA)
   ========================================================================= */
function drawParallaxA(ctx, w, h){
  ctx.clearRect(0,0,w,h);
  if(w<=0||h<=0) return;
  const cx = w/2, cy = h/2 + 8;
  const minDim = Math.min(w,h);
  const orbitBasePx = 0.16*minDim;
  const starDrawPx = 2.6*orbitBasePx;
  const d = state.pl.d, beta = state.pl.beta;
  const orbitTruePx = starDrawPx/(d*PC_AU);
  const logOrbit = lerp(Math.log10(orbitBasePx), Math.log10(Math.max(orbitTruePx,1e-9)), state.trueScale);
  const orbitPx = Math.pow(10, logOrbit);
  const zoom = state.view.zoom;
  // once the true-scale ramp has mostly collapsed the orbit, the +-p ticks, the 1 AU
  // dimension line, and separate Sun/Earth labels would all pile onto one point --
  // simplify the annotations instead of letting them clutter into illegibility.
  const collapsed = state.trueScale > 0.6;

  function toScreen(v, radiusPx){
    const pr = project3D(v);
    return { x: cx + zoom*radiusPx*pr.x, y: cy + zoom*radiusPx*pr.y };
  }
  function ringPts(radiusPx, z){
    z = z||0;
    const pts = [];
    for(let i=0;i<=64;i++){ const th=(i/64)*TAU; pts.push(toScreen({x:Math.cos(th),y:Math.sin(th),z:z}, radiusPx)); }
    return pts;
  }
  function strokeRing(radiusPx, colorHex, alpha, fillA, lw){
    const pts = ringPts(radiusPx);
    ctx.beginPath();
    pts.forEach(function(p,i){ if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
    ctx.closePath();
    if(fillA){ ctx.fillStyle = hexAlpha(colorHex, fillA); ctx.fill(); }
    ctx.strokeStyle = hexAlpha(colorHex, alpha); ctx.lineWidth = lw||1;
    ctx.stroke();
  }

  const sunS = { x:cx, y:cy };
  const lamE = earthLongitudeDeg(state.t)*RAD;
  const earthDir = { x:Math.cos(lamE), y:Math.sin(lamE), z:0 };
  const earthS = toScreen(earthDir, orbitPx);
  const betaR = beta*RAD;
  const starDir = { x:Math.cos(betaR), y:0, z:Math.sin(betaR) };
  const starS = toScreen(starDir, starDrawPx);

  // ecliptic plane: faint disk + one inner grid ellipse
  strokeRing(orbitPx*1.6, COLORS.muted, 0.22, 0.05, 1);
  strokeRing(orbitPx*0.85, COLORS.muted, 0.14, 0, 1);
  // Earth's orbit (structure, not data -- neutral gray)
  strokeRing(orbitPx, COLORS["border-strong"], 0.9, 0, 1.2);

  // "1 AU" dimension line at a fixed reference angle, independent of Earth's motion --
  // hidden once the orbit has collapsed (it would just be a stub at the Sun's dot).
  // The line/end-caps are always drawn here; the "1 AU" TEXT is decided later, as the
  // lowest-priority entry in the label overlap cascade below.
  let aupLabelPt = null, aupLabelDir = null;
  if(!collapsed){
    const dimPt = toScreen({x:Math.cos(200*RAD), y:Math.sin(200*RAD), z:0}, orbitPx);
    drawDimensionLine(ctx, sunS, dimPt, null, COLORS.text);
    const aupMidX = (sunS.x+dimPt.x)/2, aupMidY = (sunS.y+dimPt.y)/2;
    aupLabelPt = { x:aupMidX, y:aupMidY };
    aupLabelDir = outwardDir(aupMidX, aupMidY-14, aupMidX, aupMidY);
  }

  // ticks at the two Earth positions of maximum displacement (perpendicular to the
  // Sun-star projection, i.e. lambda = 90 and 270 since the star sits at longitude 0) --
  // likewise hidden once collapsed, since both ticks would land on the same point.
  // The tick MARKS are always drawn here; the "+p"/"-p" TEXT is decided later, as part
  // of the same lowest-priority cascade entry as "1 AU".
  const pTickLabels = [];
  if(!collapsed){
    [90,270].forEach(function(lamDeg){
      const pos = toScreen({x:Math.cos(lamDeg*RAD), y:Math.sin(lamDeg*RAD), z:0}, orbitPx);
      const lamSunApp = (lamDeg+180)%360;
      const disp = parallaxDisplacement(d, beta, lamSunApp);
      const sign = disp.dLambdaCosBeta >= 0 ? "+p" : "−p";
      const dir = outwardDir(pos.x,pos.y,cx,cy);
      ctx.save();
      ctx.strokeStyle = hexAlpha(COLORS.text,0.55); ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(pos.x-dir.dx*5,pos.y-dir.dy*5); ctx.lineTo(pos.x+dir.dx*9,pos.y+dir.dy*9); ctx.stroke();
      ctx.restore();
      pTickLabels.push({ pos:pos, dir:dir, text:sign });
    });
  }

  // Sun -> star (dashed, mean direction) and Earth -> star (solid, line of sight)
  ctx.save();
  ctx.setLineDash([5,4]); ctx.strokeStyle = hexAlpha(COLORS.muted,0.75); ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(sunS.x,sunS.y); ctx.lineTo(starS.x,starS.y); ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.strokeStyle = hexAlpha(COLORS.cyan,0.85); ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(earthS.x,earthS.y); ctx.lineTo(starS.x,starS.y); ctx.stroke();
  ctx.restore();

  /* -----------------------------------------------------------------------
     Label geometry for the four annotations that can crowd the star/Sun
     cluster: the wedge's angle label, "line of sight", "Earth", and "mean
     direction". Every box is computed FIRST (nothing drawn yet), then a
     single cascading overlap test decides what actually gets drawn, in
     priority order angle label > line of sight > Earth > mean direction --
     a lower-priority label is skipped for this frame if its box intersects
     any higher-priority box that's already been accepted.
     ----------------------------------------------------------------------- */
  const acceptedBoxes = [];
  function accept(box){ acceptedBoxes.push(box); return true; }
  function clearOfAccepted(box){ return !acceptedBoxes.some(function(b){ return boxesOverlap(b, box); }); }

  // "Earth": fixed below-left of the dot (independent of where the Sun/star happen to be)
  const earthLabelDir = { dx:-0.72, dy:0.7 };

  // angle label: highest priority. Placed along the bisector of Sun->star and
  // Earth->star, just outside the wedge arc -- between the two lines, never on
  // either one -- so it never needs to yield to anything else.
  const ang1 = Math.atan2(sunS.y-starS.y, sunS.x-starS.x);
  const ang2 = Math.atan2(earthS.y-starS.y, earthS.x-starS.x);
  let wedgeDelta = ang2-ang1;
  while(wedgeDelta>Math.PI) wedgeDelta -= TAU;
  while(wedgeDelta<-Math.PI) wedgeDelta += TAU;
  const wedgeR = 22;
  const midAng = ang1 + wedgeDelta/2;
  const bisectorDir = { dx:Math.cos(midAng), dy:Math.sin(midAng) };
  const angleText = fmtArcsec(parallaxArcsec(d));
  const angleLabelSize = 11;
  // "between the two lines, never on either one": for a narrow wedge, even a label
  // rotated to read along the bisector can still clip one of the two converging lines
  // close to the vertex (its near edge spans some width perpendicular to the bisector,
  // and that edge's two ends lean toward opposite rays) -- so slide it further out
  // along the bisector, in the same rotated orientation, until its box actually clears
  // both segments.
  let angleR = wedgeR+12, angleLabelPt = null, angleBox = null;
  for(let guard=0; guard<40; guard++){
    angleLabelPt = { x:starS.x+bisectorDir.dx*angleR, y:starS.y+bisectorDir.dy*angleR };
    angleBox = radialLabelBounds(ctx, angleLabelPt.x, angleLabelPt.y, angleText, midAng, angleLabelSize);
    if(!segIntersectsBox(sunS, starS, angleBox) && !segIntersectsBox(earthS, starS, angleBox)) break;
    angleR += 8;
  }
  let showAngle = false;
  if(!collapsed){
    showAngle = accept(angleBox);
  }

  // "line of sight": priority 2. Midpoint of Earth->star, offset perpendicular to
  // that segment on the side AWAY from the Sun, by at least 14px + half the text
  // height so the box clears the line itself.
  const losPt = { x:(earthS.x+starS.x)/2, y:(earthS.y+starS.y)/2 };
  const losDx = starS.x-earthS.x, losDy = starS.y-earthS.y;
  const losLen = Math.hypot(losDx,losDy) || 1;
  let perpDir = { dx:-losDy/losLen, dy:losDx/losLen };
  const towardSun = { x:sunS.x-earthS.x, y:sunS.y-earthS.y };
  if(perpDir.dx*towardSun.x + perpDir.dy*towardSun.y > 0){ perpDir = { dx:-perpDir.dx, dy:-perpDir.dy }; }
  const losLabelSize = 10;
  const losOffset = 14 + (losLabelSize*1.25)/2;
  const losBox = labelBounds(ctx, losPt.x, losPt.y, "line of sight", perpDir, { size:losLabelSize, offset:losOffset });
  const showLos = clearOfAccepted(losBox) && accept(losBox);

  // "Earth": priority 3 (only relevant when not collapsed -- the collapsed state
  // draws one combined Sun+Earth label instead, handled separately below).
  let showEarthLabel = false;
  if(!collapsed){
    const earthBox = labelBounds(ctx, earthS.x, earthS.y, "Earth", earthLabelDir, { offset:10 });
    showEarthLabel = clearOfAccepted(earthBox) && accept(earthBox);
  }

  // "mean direction": priority 4 (lowest). Anchored 45% of the way from the Sun to
  // the star along the dashed line, offset perpendicular (14px + half text height)
  // on the side AWAY from the Earth->star line.
  const meanDx = starS.x-sunS.x, meanDy = starS.y-sunS.y;
  const meanLen = Math.hypot(meanDx,meanDy) || 1;
  const meanPt = { x: lerp(sunS.x,starS.x,0.45), y: lerp(sunS.y,starS.y,0.45) };
  let meanPerp = { dx:-meanDy/meanLen, dy:meanDx/meanLen };
  const towardEarthFromSun = { x:earthS.x-sunS.x, y:earthS.y-sunS.y };
  if(meanPerp.dx*towardEarthFromSun.x + meanPerp.dy*towardEarthFromSun.y > 0){ meanPerp = { dx:-meanPerp.dx, dy:-meanPerp.dy }; }
  const meanLabelSize = 10;
  const meanOffset = 14 + (meanLabelSize*1.25)/2;
  const meanBox = labelBounds(ctx, meanPt.x, meanPt.y, "mean direction", meanPerp, { size:meanLabelSize, offset:meanOffset });
  const showMean = clearOfAccepted(meanBox) && accept(meanBox);

  // "1 AU" and the +-p tick labels: lowest priority, below "mean direction". Only
  // the TEXT is gated here -- the dimension line, its end-caps, and the tick marks
  // were already drawn above unconditionally. Unlike the angle/line-of-sight/mean-
  // direction labels, these sit at fixed geometric positions with no built-in search
  // for clearing the two lines, so also check directly against both segments (the
  // Earth->star line sweeps around across the year and can pass near either one).
  function clearOfLines(box){ return !segIntersectsBox(sunS, starS, box) && !segIntersectsBox(earthS, starS, box); }
  let showAup = false;
  if(!collapsed && aupLabelPt){
    const aupBox = labelBounds(ctx, aupLabelPt.x, aupLabelPt.y, "1 AU", aupLabelDir, { size:10.5, offset:0 });
    showAup = clearOfLines(aupBox) && clearOfAccepted(aupBox) && accept(aupBox);
  }
  const showPTick = pTickLabels.map(function(t){
    const box = labelBounds(ctx, t.pos.x, t.pos.y, t.text, t.dir, { size:10.5, offset:15 });
    return clearOfLines(box) && clearOfAccepted(box) && accept(box);
  });

  if(showMean){
    drawLabel(ctx, meanPt.x, meanPt.y, "mean direction", meanPerp, { color:COLORS.muted, size:meanLabelSize, offset:meanOffset });
  }
  if(showLos){
    drawLabel(ctx, losPt.x, losPt.y, "line of sight", perpDir, { color:COLORS.cyan, size:losLabelSize, offset:losOffset });
  }
  if(showAup){
    drawLabel(ctx, aupLabelPt.x, aupLabelPt.y, "1 AU", aupLabelDir, { color:COLORS.text, size:10.5, offset:0 });
  }
  pTickLabels.forEach(function(t, i){
    if(showPTick[i]){
      drawLabel(ctx, t.pos.x, t.pos.y, t.text, t.dir, { color:COLORS.text, size:10.5, offset:15 });
    }
  });

  // exaggerated wedge at the star, labeled with the TRUE parallax angle -- omitted
  // once collapsed (the true angle is already in the header readouts, and the
  // wedge/label would just crowd the single remaining point). Top priority, so
  // it is always drawn whenever the wedge itself is drawn.
  if(!collapsed){
    ctx.save();
    ctx.strokeStyle = hexAlpha(COLORS.amber,0.9); ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.arc(starS.x,starS.y,wedgeR, ang1, ang1+wedgeDelta, wedgeDelta<0); ctx.stroke();
    ctx.restore();
    drawRadialLabel(ctx, angleLabelPt.x, angleLabelPt.y, angleText, midAng, angleLabelSize, COLORS.amber);
  }

  // Earth's trail over the current year (fading toward the tail)
  drawFadingArc(ctx, function(ang){ return toScreen({x:Math.cos(ang),y:Math.sin(ang),z:0}, orbitPx); },
    lamE, clamp(state.t,0,YEAR_DAYS)/YEAR_DAYS*TAU, COLORS.cyan, 0.9, 72);

  // markers, drawn last so they sit on top
  if(glowAmber) drawGlow(ctx, glowAmber, sunS.x, sunS.y, 30);
  ctx.fillStyle = COLORS.amber;
  ctx.beginPath(); ctx.arc(sunS.x,sunS.y,7,0,TAU); ctx.fill();

  if(glowCyan) drawGlow(ctx, glowCyan, earthS.x, earthS.y, 18);
  ctx.fillStyle = COLORS.cyan;
  ctx.beginPath(); ctx.arc(earthS.x,earthS.y,4.5,0,TAU); ctx.fill();

  if(collapsed){
    // Sun and Earth's orbit have collapsed onto the same point -- one combined label,
    // placed below-left of the dot (same fixed direction as the ordinary "Earth" label),
    // clear of the line-of-sight line/label which run up toward the star.
    drawLabel(ctx, sunS.x, sunS.y, "Sun + Earth's orbit (smaller than a pixel)", earthLabelDir, { color:COLORS.amber, offset:16 });
  } else {
    drawLabel(ctx, sunS.x, sunS.y, "Sun", {dx:0,dy:-1}, { color:COLORS.amber, offset:12 });
    if(showEarthLabel){
      drawLabel(ctx, earthS.x, earthS.y, "Earth", earthLabelDir, { color:COLORS.cyan, offset:10 });
    }
  }

  if(glowStar) drawGlow(ctx, glowStar, starS.x, starS.y, 28);
  ctx.fillStyle = "#eaffff";
  ctx.beginPath(); ctx.arc(starS.x,starS.y,5.5,0,TAU); ctx.fill();
  drawLabel(ctx, starS.x, starS.y, "target star", outwardDir(starS.x,starS.y,cx,cy), { color:"#eaffff", offset:12 });

  // caption: "not to scale" note, or the true-scale punchline once the ramp completes
  if(state.trueScale < 0.985){
    els.panelACaption.classList.remove("truescale");
    els.panelACaption.textContent = "Diagram not to scale: the star is drawn about 2.6 orbit-radii from the Sun; in reality it is " + fmtSciPlain(d*PC_AU/2.6,1) + " times farther.";
  } else {
    els.panelACaption.classList.add("truescale");
    const orbitDiamPx = 2*orbitTruePx*zoom;
    els.panelACaption.innerHTML = "At true scale the whole orbit is " + fmtScientific(orbitDiamPx,1) + " px across: this is why Tycho saw nothing.";
  }
}

/* =========================================================================
   17. PARALLAX TAB -- SKY PANEL ("what the observer sees", canvasB)
   ========================================================================= */
function drawParallaxB(ctx, w, h){
  ctx.clearRect(0,0,w,h);
  if(w<=0||h<=0) return;
  const cx = w/2, cy = h/2;
  const d = state.pl.d, beta = state.pl.beta;
  const p = parallaxArcsec(d);
  const majorArcsec = p, minorArcsec = p*Math.abs(Math.sin(beta*RAD));
  const pxPerArcsec = (0.55*w) / (2*Math.max(majorArcsec, 1e-12));

  if(state.display.bgstars){
    BG_STARS.forEach(function(s){
      ctx.fillStyle = hexAlpha(COLORS.text, s.a*0.6);
      ctx.beginPath(); ctx.arc(s.rx*w, s.ry*h, s.r, 0, TAU); ctx.fill();
    });
  }

  // parallactic ellipse (dashed purple); sign: +dLambda drawn LEFT, +dBeta drawn UP
  ctx.save();
  ctx.setLineDash([4,4]);
  ctx.strokeStyle = hexAlpha(COLORS.purple, 0.75); ctx.lineWidth = 1.2;
  ctx.beginPath();
  for(let i=0;i<=72;i++){
    const th = (i/72)*TAU;
    const x = cx - Math.cos(th)*majorArcsec*pxPerArcsec;
    const y = cy - Math.sin(th)*minorArcsec*pxPerArcsec;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.stroke();
  ctx.restore();

  // mean-position crosshair
  ctx.strokeStyle = hexAlpha(COLORS.muted,0.45); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(cx-6,cy); ctx.lineTo(cx+6,cy); ctx.moveTo(cx,cy-6); ctx.lineTo(cx,cy+6); ctx.stroke();

  // trail from t=0 to the current day (mod year), fading toward the tail, then the live marker
  const tCur = clamp(((state.t%YEAR_DAYS)+YEAR_DAYS)%YEAR_DAYS, 0, YEAR_DAYS);
  const segs = 90;
  function posAtT(tt){
    const lamSun = sunApparentLongitudeDeg(tt);
    const disp = parallaxDisplacement(d, beta, lamSun);
    return { x: cx - disp.dLambdaCosBeta*pxPerArcsec, y: cy - disp.dBeta*pxPerArcsec };
  }
  for(let i=0;i<segs;i++){
    const p0 = posAtT(tCur*i/segs), p1 = posAtT(tCur*(i+1)/segs);
    ctx.strokeStyle = hexAlpha(COLORS.cyan, 0.12+0.6*(i/segs));
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
  }
  const cur = posAtT(tCur);
  if(glowCyan) drawGlow(ctx, glowCyan, cur.x, cur.y, 20);
  ctx.fillStyle = COLORS.cyan;
  ctx.beginPath(); ctx.arc(cur.x,cur.y,4,0,TAU); ctx.fill();
  drawLabel(ctx, cur.x, cur.y, "target star", outwardDir(cur.x,cur.y,cx,cy), { color:COLORS.cyan, size:10, offset:10 });

  // scale bar
  const bar = niceScaleLength(pxPerArcsec, w);
  const barY = h-16, barX0 = 12, barX1 = barX0+bar.px;
  ctx.strokeStyle = COLORS.text; ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(barX0,barY); ctx.lineTo(barX1,barY);
  ctx.moveTo(barX0,barY-4); ctx.lineTo(barX0,barY+4);
  ctx.moveTo(barX1,barY-4); ctx.lineTo(barX1,barY+4);
  ctx.stroke();
  ctx.fillStyle = COLORS.text; ctx.font = "10px Inter, sans-serif"; ctx.textAlign="left"; ctx.textBaseline="bottom";
  ctx.fillText(bar.label, barX0, barY-6);

  const panelSpanArcsec = w/pxPerArcsec;
  els.panelBCaption.textContent = "East (positive Δλ) is drawn to the left, as astronomers plot the sky. Panel spans " + fmtArcsec(panelSpanArcsec) + " edge to edge.";
}

/* =========================================================================
   18. MAGNITUDES TAB -- THE LADDER (canvasA)
   ========================================================================= */
function drawMagA(ctx, w, h){
  ctx.clearRect(0,0,w,h);
  if(w<=0||h<=0) return;
  const padTop=16, padBottom=16;
  const mMin=-28, mMax=32;
  const plotH = h-padTop-padBottom;
  function yOf(m){ return padTop + (m-mMin)/(mMax-mMin)*plotH; }
  const rulerX = clamp(w*0.42, 88, 168);

  const yNaked = yOf(6);
  ctx.fillStyle = hexAlpha(COLORS.coral, 0.08);
  ctx.fillRect(0, yNaked, w, Math.max(0,h-yNaked));
  ctx.strokeStyle = hexAlpha(COLORS.coral,0.35); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,yNaked); ctx.lineTo(w,yNaked); ctx.stroke();
  if(labelsOn()){
    ctx.fillStyle = hexAlpha(COLORS.coral,0.9);
    ctx.font = "9.5px Inter, sans-serif"; ctx.textAlign="right"; ctx.textBaseline="top";
    ctx.fillText("invisible to the naked eye", w-6, yNaked+3);
  }

  ctx.strokeStyle = COLORS["border-strong"]; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(rulerX, padTop-4); ctx.lineTo(rulerX, h-padBottom+4); ctx.stroke();
  ctx.fillStyle = COLORS.muted; ctx.font="9px Inter, sans-serif"; ctx.textAlign="center";
  ctx.textBaseline="bottom"; ctx.fillText("bright", rulerX, padTop-6);
  ctx.textBaseline="top"; ctx.fillText("faint", rulerX, h-padBottom+6);

  ctx.textAlign="left"; ctx.font="9px Inter, sans-serif";
  for(let m=-30; m<=30; m+=10){
    if(m<mMin||m>mMax) continue;
    const y = yOf(m);
    ctx.strokeStyle = hexAlpha(COLORS.muted,0.35); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(rulerX,y); ctx.lineTo(rulerX+5,y); ctx.stroke();
    const logF = logFluxRelVega(m);
    ctx.fillStyle = COLORS.muted; ctx.textBaseline="middle";
    ctx.fillText((logF>=0?"+":"")+logF.toFixed(0), rulerX+8, y);
  }
  if(labelsOn()){
    ctx.fillStyle = COLORS.muted; ctx.font="9px Inter, sans-serif"; ctx.textAlign="right"; ctx.textBaseline="top";
    ctx.fillText("log F/F_Vega", w-6, padTop-2);
  }

  ctx.textAlign="right"; ctx.font="9px Inter, sans-serif";
  LADDER_LANDMARKS.forEach(function(lm){
    const y = yOf(lm.m);
    ctx.strokeStyle = hexAlpha(COLORS.text,0.5); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(rulerX-6,y); ctx.lineTo(rulerX,y); ctx.stroke();
    if(labelsOn()){
      ctx.fillStyle = COLORS.text; ctx.textBaseline="middle";
      const txt = lm.label+" ("+lm.m.toFixed(Number.isInteger(lm.m)?0:2)+")";
      const textW = ctx.measureText(txt).width;
      // right-align at rulerX-9, but never let the left edge run off-canvas
      const rightEdge = Math.max(rulerX-9, 4+textW);
      ctx.fillText(txt, rightEdge, y);
    }
  });

  const M = state.mg.M, d = state.mg.d, Av = state.mg.av;
  const yM = yOf(clamp(M,mMin,mMax));
  ctx.fillStyle = COLORS.amber;
  ctx.beginPath(); ctx.arc(rulerX, yM, 4, 0, TAU); ctx.fill();
  drawLabel(ctx, rulerX, yM, "M (at 10 pc)", {dx:1,dy:-0.7}, { color:COLORS.amber, size:10.5, offset:14 });

  const m = apparentMag(M,d,Av);
  const ym = yOf(clamp(m,mMin,mMax));
  if(glowCyan) drawGlow(ctx, glowCyan, rulerX, ym, 16);
  ctx.fillStyle = COLORS.cyan;
  ctx.beginPath(); ctx.arc(rulerX, ym, 5, 0, TAU); ctx.fill();
  const pr = magPresetByKey(state.mg.preset);
  const starName = pr ? pr.name : "Custom star";
  drawLabel(ctx, rulerX, ym, starName+" (m="+m.toFixed(2)+")", {dx:1,dy:0.7}, { color:COLORS.cyan, size:11, offset:14 });
}

/* =========================================================================
   19. MAGNITUDES TAB -- APPARENT MAGNITUDE VS DISTANCE (canvasB)
   ========================================================================= */
function drawMagB(ctx, w, h){
  ctx.clearRect(0,0,w,h);
  if(w<=0||h<=0) return;
  const padL=42, padR=12, padT=14, padB=32;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  if(plotW<=0||plotH<=0) return;
  const dMin=1, dMax=100000, mMin=-16, mMax=40;
  const logMin=Math.log10(dMin), logMax=Math.log10(dMax);
  function xOf(dd){ return padL + (Math.log10(dd)-logMin)/(logMax-logMin)*plotW; }
  function yOf(mm){ return padT + (mm-mMin)/(mMax-mMin)*plotH; }

  ctx.strokeStyle = hexAlpha(COLORS.muted,0.4); ctx.lineWidth=1;
  ctx.strokeRect(padL,padT,plotW,plotH);

  ctx.font="9px Inter, sans-serif";
  for(let e=0; Math.pow(10,e)<=dMax+1; e++){
    const dd = Math.pow(10,e);
    if(dd<dMin) continue;
    const x = xOf(dd);
    ctx.strokeStyle = hexAlpha(COLORS.muted,0.15); ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,padT+plotH); ctx.stroke();
    ctx.fillStyle = COLORS.muted; ctx.textAlign="center"; ctx.textBaseline="top";
    ctx.fillText(dd>=1000 ? (dd/1000)+"k" : String(dd), x, padT+plotH+4);
  }
  ctx.textAlign="center"; ctx.textBaseline="bottom"; ctx.fillText("distance (pc)", padL+plotW/2, h-4);

  for(let m=Math.ceil(mMin/10)*10; m<=mMax; m+=10){
    const y = yOf(m);
    ctx.strokeStyle = hexAlpha(COLORS.muted,0.15); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+plotW,y); ctx.stroke();
    ctx.fillStyle = COLORS.muted; ctx.textAlign="right"; ctx.textBaseline="middle";
    ctx.fillText(String(m), padL-6, y);
  }

  const M = state.mg.M, Av = state.mg.av, d = state.mg.d;
  const N = 80;
  function curvePath(avVal){
    ctx.beginPath();
    for(let i=0;i<=N;i++){
      const dd = Math.pow(10, logMin+(i/N)*(logMax-logMin));
      const mm = apparentMag(M,dd,avVal);
      const x=xOf(dd), y=yOf(clamp(mm,mMin,mMax));
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
  }
  if(Av>0){
    ctx.save(); ctx.setLineDash([4,4]);
    ctx.strokeStyle = hexAlpha(COLORS.muted,0.7); ctx.lineWidth=1.3;
    curvePath(0); ctx.stroke(); ctx.restore();
  }
  ctx.strokeStyle = hexAlpha(COLORS.cyan,0.9); ctx.lineWidth=1.8;
  curvePath(Av); ctx.stroke();

  const yNaked = yOf(6);
  ctx.save(); ctx.setLineDash([3,3]);
  ctx.strokeStyle = hexAlpha(COLORS.muted,0.7); ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(padL,yNaked); ctx.lineTo(padL+plotW,yNaked); ctx.stroke();
  ctx.restore();
  if(labelsOn()){
    ctx.fillStyle = COLORS.muted; ctx.textAlign="right"; ctx.textBaseline="bottom"; ctx.font="9.5px Inter, sans-serif";
    ctx.fillText("naked-eye limit (m=6)", padL+plotW-4, yNaked-3);
  }
  const dNaked = distanceFromMag(6, M, Av);
  if(dNaked>=dMin && dNaked<=dMax){
    const xN = xOf(dNaked);
    ctx.fillStyle = COLORS.coral;
    ctx.beginPath(); ctx.arc(xN,yNaked,4,0,TAU); ctx.fill();
    if(labelsOn()){
      // leader line + text placed clear of both the point and the dashed naked-eye-limit line
      const goRight = xN < padL + plotW*0.6;
      const lx = xN + (goRight ? 34 : -34);
      const ly = yNaked - 26;
      ctx.save();
      ctx.strokeStyle = hexAlpha(COLORS.coral,0.7); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(xN,yNaked); ctx.lineTo(lx,ly); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = COLORS.coral; ctx.font="10px Inter, sans-serif";
      ctx.textAlign = goRight ? "left" : "right";
      ctx.textBaseline = "bottom";
      ctx.fillText("naked-eye out to d = "+fmtParsec(dNaked), lx + (goRight?4:-4), ly);
    }
  }

  if(10>=dMin && 10<=dMax){
    const x10 = xOf(10);
    ctx.save(); ctx.setLineDash([2,3]);
    ctx.strokeStyle = hexAlpha(COLORS.text,0.35); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x10,padT); ctx.lineTo(x10,padT+plotH); ctx.stroke();
    ctx.restore();
    if(labelsOn()){
      ctx.fillStyle = COLORS.text; ctx.textAlign="center"; ctx.textBaseline="top"; ctx.font="10px Inter, sans-serif";
      ctx.fillText("m = M", x10, padT+2);
    }
  }

  const m = apparentMag(M,d,Av);
  const xc = clamp(xOf(d), padL, padL+plotW), yc = clamp(yOf(m), padT, padT+plotH);
  ctx.fillStyle = COLORS.magenta;
  ctx.beginPath(); ctx.arc(xc,yc,5,0,TAU); ctx.fill();
  ctx.strokeStyle = COLORS.canvas; ctx.lineWidth=1.5; ctx.stroke();
}

/* =========================================================================
   20. RENDER LOOP / RESIZE / INIT
   ========================================================================= */
function render(){
  updateReadouts();
  {
    const nowMs = performance.now();
    if(!state.playing || nowMs - (state._lastFormulaMs||0) > 100){ state._lastFormulaMs = nowMs; updateFormulasCard(); }
  }
  const ctxA = els.canvasA.getContext("2d");
  const ctxB = els.canvasB.getContext("2d");
  const wA = state.mainW || els.canvasA.clientWidth, hA = state.mainH || els.canvasA.clientHeight;
  const wB = state.panelBW || els.canvasB.clientWidth, hB = state.panelBH || els.canvasB.clientHeight;
  if(state.tab === "parallax"){ drawParallaxA(ctxA,wA,hA); drawParallaxB(ctxB,wB,hB); }
  else { drawMagA(ctxA,wA,hA); drawMagB(ctxB,wB,hB); }
  updateZoomBadge();
}

function setupCanvasResize(canvas, onSize){
  const ctx = canvas.getContext("2d");
  const ro = new ResizeObserver(function(){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const cw = Math.max(1, Math.round(rect.width));
    const ch = Math.max(1, Math.round(rect.height));
    canvas.width = cw*dpr; canvas.height = ch*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(onSize) onSize(cw,ch);
    render();
  });
  ro.observe(canvas);
}

function init(){
  if(new URLSearchParams(location.search).get("embed")) document.body.classList.add("embed");

  cacheEls();
  loadColors();
  glowAmber = makeGlowSprite(COLORS.amber, 40);
  glowCyan = makeGlowSprite(COLORS.cyan, 30);
  glowStar = makeGlowSprite("#eaffff", 36);

  wireTabs();
  wireDisplayToggles();
  wirePlayback();
  wireKeyboard();
  wireSplitters();
  wireCanvasAView();

  setupCanvasResize(els.canvasA, function(w,h){ state.mainW=w; state.mainH=h; });
  setupCanvasResize(els.canvasB, function(w,h){ state.panelBW=w; state.panelBH=h; });

  switchTab(state.tab);
  updatePlayButton();

  const requestedTab = new URLSearchParams(location.search).get("tab");
  if(requestedTab && TAB_ORDER.indexOf(requestedTab)>=0) switchTab(requestedTab);
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

})();
</script>
