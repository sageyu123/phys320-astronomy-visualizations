const metadata={stretch:['Geometry','Differential gravity across a body',"Left: pull toward the primary at every point · Right: the same arrows minus the centre’s arrow · residual arrows magnified",'Exact versus first order',"1. Drag left–right on the left view (or use the slider) to move the primary.<br>2. Compare the two halves: equal-looking arrows on the left become a stretch-and-squeeze pattern on the right.<br>3. Watch the lower chart: the first-order formula is excellent once d ≳ 10 R.","All thirteen arrows point at the primary and differ only slightly; the difference is the tide. The residual field stretches along the line and squeezes across it.","Point-mass primary, exact inverse-square forces at thirteen points of a rigid sphere, residual = force minus the force at the centre. The ellipse is a fixed 1.16 : 0.92 illustration, not the computed equilibrium shape. The real equilibrium ocean tide on Earth is 0.54 m peak-to-trough for the Moon and 0.25 m for the Sun. Residual arrows are rescaled so the largest is always visible."],tides:['Moon, Sun and observer','Two bulges: Moon and Sun','View from above the north pole · Sun to the right · bulges exaggerated ≈ 1.8 million times · Moon orbit not to scale','Tide height at the observer over one month','1. Press ▶ and watch the observer sweep through two high tides a day while the Moon creeps around its orbit.<br>2. Drag the Moon to new, quarter and full positions and read the range.<br>3. Turn the Sun off to see the Moon-only tide.',"The bulge follows the Moon. High tides are 12 h 25 min apart because the Moon has moved on by the time Earth turns once.","Equilibrium tide: ocean surface height ζ = H·P₂(cos ψ) for each body, summed; observer on the equator; Sun direction fixed; Earth turns once per solar day and the Moon advances at the synodic rate. No Love numbers, ocean dynamics, latitude or lunar declination. Bulge heights are magnified ×1.8 million; the Moon's orbit is drawn at a fixed radius (true: 60 R⊕)."],friction:['Lag and spin','Lagging bulge, braking torque','Lag angle and bulge height exaggerated (textbook lag ≈ 3°, bulge ≈ 0.5 m) · Moon distance not to scale','Same face: the locked Moon','1. Slide the lag angle through zero and watch the torque arrow flip.<br>2. Turn on “Animate spin”: the surface moves through a bulge that stays put.<br>3. In the lower panel set spin/orbit to 1 and see why we only ever see one face.',"Only the tangential parts of the two pulls make torque, and the near bulge wins because it is closer. The reaction pushes the Moon forward along its orbit.","Two point bulges of mass m_b at ±R⊕(1.16) along an axis leading by δ; exact inverse-square pulls from the Moon at the true 60.3 R⊕ (the Moon is drawn closer). The lag angle, bulge height and Moon size are exaggerated."],spiral:['Time','Earth and Moon, to scale in distance','Distances to scale (1 tick = 10 R⊕) · Earth and Moon drawn no smaller than 6 px and 4 px · constant-rate model, past is an extrapolation','Angular-momentum budget','1. Scrub time (or press ▶). The Moon drifts out, its speed arrow shrinks, the day stretches.<br>2. Watch the budget: whatever the spin loses, the orbit gains.<br>3. Go to the end: day = month, the torque is gone.',"v falls as a⁻¹ᐟ² while L rises as a¹ᐟ²: speeding the Moon up ends with it moving slower. Earth's spin is only 17% of the budget today.","Angular momentum: Earth's spin plus the Moon's circular orbit about the barycentre, total conserved. The Sun's tide, solar-orbit angular momentum, the Moon's spin, obliquity and past orbital eccentricity are ignored. Torque today is set by 2.3 ms per century, giving 4.2 cm/yr (laser ranging: 3.8 cm/yr). The rate scales as a⁻¹¹ᐟ²; the past is an extrapolation because today's ocean dissipation is unusually strong."],roche:['Planet and satellite','A satellite approaching its planet','Planet and distances to scale · satellite enlarged · deformation and break-up schematic','Self-gravity versus tidal stretch','1. Drag the satellite toward Saturn. It stretches, then breaks into a ring inside the magenta circle.<br>2. Change the satellite density: ice breaks up farther out than rock.<br>3. Change its radius: the circles do not move.',"The limit depends on the density ratio and the planet's radius, not on the satellite's size: both self-gravity and tidal stretch are proportional to R_m. Saturn's rings sit around the limit for ice.","M_p = (4/3)πρ_pR_p³ from the preset values. Slide 11 rounds Roche's coefficient to 2.44, which gives 2.03 R_p; 2.456 gives 2.04 R_p — both ≈ 122,000 km. The rigid estimate is 2¹ᐟ³ ≈ 1.26; Roche's 2.456 is for a fluid body that stretches as it approaches. Small bodies can be held together by material strength. Deformation and debris are schematic."]};
metadata.stretch.splice(4,3,"1. Drag left–right on the left view (or use the slider) to move the primary.<br>2. Compare the two halves: equal-looking arrows on the left become a stretch-and-squeeze pattern on the right.<br>3. Watch the lower chart: the first-order formula is excellent once d ≳ 10 R.","All thirteen arrows point at the primary and differ only slightly; the difference is the tide. The residual field is ×2 outward along the line and ×1 inward across it, so the shape is a football, not a teardrop.","Point-mass primary, exact inverse-square forces at thirteen points of a rigid sphere, residual = force minus the force at the centre. The ellipse is a fixed 1.16 : 0.92 illustration, not the computed equilibrium shape; the real equilibrium ocean tide on Earth is 0.54 m peak-to-trough for the Moon and 0.25 m for the Sun (equilibrium theory, no Love numbers). Residual arrows are rescaled so the largest is always visible; the magnification is printed on the view.");
metadata.tides.splice(4,3,"1. Press ▶ and watch the observer sweep through two high tides a day while the Moon creeps around its orbit.<br>2. Drag the Moon to new, quarter and full positions and read the range.<br>3. Turn the Sun off to see the Moon-only tide.","The bulge follows the Moon, not the Sun: the Sun is 27 million times more massive but 390 times farther, and tides fall as 1/d³. High tides are 12 h 25 min apart because the Moon has moved on by the time Earth turns once.","Equilibrium tide: ocean surface height ζ = H·P₂(cos ψ) for each body with H = (M/M⊕)(R⊕/d)³R⊕, summed; observer on the equator; Sun direction fixed; Earth turns once per solar day and the Moon advances at the synodic rate. No Love numbers, ocean dynamics, latitude or lunar declination. Bulge heights are magnified ×1.8 million; the Moon's orbit is drawn at a fixed radius (true: 60 R⊕).");
metadata.friction.splice(4,3,"1. Slide the lag angle through zero and watch the torque arrow flip.<br>2. Turn on “Animate spin”: the surface moves through a bulge that stays put.<br>3. In the lower panel set spin/orbit to 1 and see why we only ever see one face.","Only the tangential parts of the two pulls make torque, and the near bulge wins because it is closer. The reaction pushes the Moon forward along its orbit: that is where Earth's lost spin goes.","Two point bulges of mass m_b at ±R⊕(1.16) along an axis leading by δ; exact inverse-square pulls from the Moon at the true 60.3 R⊕ (the Moon is drawn closer). The first-order torque is −3GM m_b R² sin 2δ / d³. The lag angle, bulge height and Moon size are exaggerated; the 2.3 ms per century and the ≈20× ratio are the lecture's values.");
metadata.spiral.splice(4,3,"1. Scrub time (or press ▶). The Moon drifts out, its speed arrow shrinks, the day stretches.<br>2. Watch the budget: whatever the spin loses, the orbit gains.<br>3. Go to the end: day = month, the bulge sits on the Earth–Moon line, and the torque is gone.","v falls as a^{-1/2} while L rises as a^{1/2}: speeding the Moon up ends with it moving slower. The Earth's spin is only 17 % of the budget today; by the lock it is under 1 %.","Angular momentum: Earth's spin (I = 0.3307 M⊕R⊕², sidereal ω) plus the Moon's circular orbit about the barycentre (μ√(GM_tot a)), total conserved; the Sun's tide and the Moon's own spin are ignored. Torque today is set so the day lengthens 2.3 ms per century (slide 9), which gives 4.2 cm/yr recession (lunar laser ranging: 3.8 cm/yr). The rate is scaled as a^{-11/2} (constant lag angle), which integrates to the closed form shown; it ends at the lock where ω = n, a = 86.9 R⊕, P = 47.2 d, after 13.7 Gyr here. Run backwards the same law puts the Moon at Earth's surface 1.4 Gyr ago, which is wrong (the Moon is 4.5 Gyr old): today's ocean tides are unusually dissipative, so the past is marked as an extrapolation and the slider stops at −1 Gyr.");
metadata.roche.splice(4,3,"1. Drag the satellite toward Saturn. It stretches, then breaks into a ring inside the magenta circle.<br>2. Change the satellite's density: ice breaks up farther out than rock.<br>3. Change its radius: the circles do not move.","The limit depends on the density ratio and the planet's radius, not on the satellite's size: both self-gravity and tidal stretch are proportional to R_m. Saturn's rings sit around the limit for ice.","M_p = (4/3)πρ_pR_p³ from the preset values (slide 11 rounds Saturn to 60,000 km and 690 kg m⁻³). f_R = 2.456 is Roche's coefficient from slide 10; slide 11 rounds it to 2.44 (2.03 R_p). The faint circle is the rigid two-point estimate 2^{1/3} ≈ 1.26; the gap between it and 2.456 is what a deformable, cohesionless body loses by stretching. Real small bodies have tensile strength (a 13 km comet does not need self-gravity to hold together), so the limit applies to large or rubble-pile bodies. The deformation and the debris arc are schematic.");
function slider(label,key,min,max,step,value,log=false,scale=1){return `<div class="field"><div class="field-label">${label}</div><div class="field-row"><input type="range" data-key="${key}" data-log="${log?1:0}" data-scale="${scale}" min="${min}" max="${max}" step="${step}" value="${log?Math.log10(value/scale):value/scale}"><input class="num-input" type="number" data-num="${key}" data-scale="${scale}" value="${Number((value/scale).toPrecision(6))}"></div></div>`}
function toggle(label,key,on){return `<label class="small"><input class="toggle" type="checkbox" data-toggle="${key}" ${on?'checked':''}> ${label}</label><br>`}function chip(label,action){return `<button class="chip" data-action="${action}">${label}</button>`}
function controlsHtml(){let s=S[tab];if(tab==='stretch')return slider('Distance d / R','D',.398,4.477,.005,s.D,true)+['Teaching · d = 10 R','Moon → Earth · 60.3 R⊕','Sun → Earth · 23,482 R⊕','Earth → Moon · 221 R☾'].map((x,i)=>chip(x,'pair'+i)).join('')+toggle('Show interior points','interior',s.interior);if(tab==='tides')return chip('▶ / pause','play')+chip('Reset','reset')+slider('Speed (hours per second)','speed',1,48,1,s.speed)+slider('Moon position (°)','thetaM0',0,360,1,s.thetaM0,false,rad)+slider('Observer longitude (°)','obsLon',0,360,5,s.obsLon,false,rad)+toggle("Include the Sun's tide",'sunOn',s.sunOn)+['New Moon · spring','First quarter · neap','Full Moon · spring','Third quarter · neap'].map((x,i)=>chip(x,'phase'+i)).join('');if(tab==='friction')return slider('Lag angle δ (°)','lagDeg',-20,20,.5,s.lagDeg)+['Today · δ = 3°','Locked · δ = 0','Spin slower than orbit · δ = −3°'].map((x,i)=>chip(x,'lag'+i)).join('')+toggle('Animate spin','animateSpin',s.animateSpin)+chip('Orbit ▶ / pause','orbit')+slider('Spin per orbit s','spinRatio',0,3,.25,s.spinRatio)+['0','1 (locked)','2'].map((x,i)=>chip(x,'spin'+i)).join('');if(tab==='spiral')return slider('Time from today (Gyr)','tGyr',-1,maxT,.01,s.tGyr)+chip('▶ / pause','play')+slider('Speed (Gyr per second)','speed',.1,2,.1,s.speed)+['Reset to today','−1 Gyr','today','+1 Gyr','+5 Gyr','locked'].map((x,i)=>chip(x,'time'+i)).join('');return ['Saturn','Jupiter','Earth','Sun'].map((x,i)=>chip(x,'primary'+i)).join('')+slider('ρ_p (kg m⁻³)','rhoP',300,6000,10,s.rhoP)+slider('R_p (km)','Rp',3,6,.005,s.Rp,true,1000)+['Icy · 1200','Comet · 500','Rocky · 3000','Moon-like · 3340'].map((x,i)=>chip(x,'density'+i)).join('')+slider('ρ_m (kg m⁻³)','rhoM',300,6000,10,s.rhoM)+slider('R_m (km)','Rm',0,Math.log10(2000),.005,s.Rm,true,1000)+slider('Distance r / R_p','r',1.05,6,.01,s.r)+chip('Lecture example','lecture')}
function installControls(){let s=S[tab];$('controls').querySelectorAll('[data-key],[data-num]').forEach(el=>el.oninput=()=>{let key=el.dataset.key||el.dataset.num,v=Number(el.value)*(Number(el.dataset.scale)||1);if(el.dataset.log==='1')v=10**Number(el.value)*(Number(el.dataset.scale)||1);let bounds={D:[2.5,30000],speed:tab==='tides'?[1,48]:[.1,2],thetaM0:[0,2*pi],obsLon:[0,2*pi],lagDeg:[-20,20],spinRatio:[0,3],tGyr:[-1,maxT],rhoP:[300,6000],rhoM:[300,6000],Rp:[1e6,1e9],Rm:[1e3,2e6],r:[1.05,6]};if(bounds[key])v=clamp(v,...bounds[key]);s[key]=v;paint();renderMath();syncControls(el)});$('controls').querySelectorAll('[data-toggle]').forEach(el=>el.onchange=()=>{s[el.dataset.toggle]=el.checked;paint();renderMath();startLoop()});$('controls').querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{let a=el.dataset.action,i=Number(a.slice(-1));if(a.startsWith('pair')){s.pair=['moonEarth','moonEarth','sunEarth','earthMoon'][i];s.D=i===0?10:pairs[s.pair].d/pairs[s.pair].R}if(a.startsWith('phase')){s.thetaM0=i*pi/2;s.t=0}if(a.startsWith('lag'))s.lagDeg=[3,0,-3][i];if(a.startsWith('spin'))s.spinRatio=i;if(a==='orbit')s.orbitPlaying=!s.orbitPlaying;if(a==='play')s.playing=!s.playing;if(a==='reset')Object.assign(s,{t:0,thetaM0:50*rad,obsLon:0});if(a.startsWith('time'))s.tGyr=[0,-1,0,1,5,maxT][i];if(a.startsWith('primary')){let p=[[6e7,690,'saturn'],[71492000,1326,'jupiter'],[6371000,5514,'earth'],[696e6,1408,'sun']][i];[s.Rp,s.rhoP,s.primary]=p}if(a.startsWith('density'))s.rhoM=[1200,500,3000,3340][i];if(a==='lecture')Object.assign(s,{Rp:6e7,rhoP:690,rhoM:1200,Rm:13000,r:3,primary:'saturn'});$('controls').innerHTML=controlsHtml();installControls();paint();renderMath();startLoop()})}
function syncControls(skip){$('controls').querySelectorAll('[data-key],[data-num]').forEach(el=>{if(el===skip)return;let key=el.dataset.key||el.dataset.num,v=S[tab][key]/(Number(el.dataset.scale)||1);el.value=el.dataset.log==='1'?Math.log10(v):Number(v.toPrecision(6))})}
function readouts(){let s=S[tab];if(tab==='stretch'){let p=pairs[s.pair],x=1/s.D;return {'d / R':s.D,'exact [(1+R/d)⁻² − (1−R/d)⁻²]':model.tidalBracketExact(x),'first order −4R/d':model.tidalBracketApprox(x),'relative error ≈ 2(R/d)²':200*x*x,'ΔF/m across the diameter at this d':model.deltaForcePerMass(p.M,p.R,p.R*s.D),'ΔF/m at the real distance':model.deltaForcePerMass(p.M,p.R,p.d),'ocean bulge (equilibrium) at the real distance':s.pair==='earthMoon'?'—':1.5*model.equilibriumTideHeight(p.M,p.d)}}if(tab==='tides'){let f=model.tideFrame(s.t,s.thetaM0,s.obsLon),h=s.sunOn?hs:0,e=model.tideEnvelope(f.thetaM,0,hm,h);return {'ΔF☉ / ΔF☾':model.sunMoonRatio(),'Moon tide amplitude H☾':hm,'Sun tide amplitude H☉':hs,'range now (peak-to-trough)':2*e.amp,'spring range':1.5*(hm+hs),'neap range':1.5*(hm-hs),'time between high tides':model.lunarHighTideInterval(),'phase':model.phaseName(f.thetaM),'height at observer now':model.tideHeightAt(f.phi,f.thetaM,0,hm,h)}}if(tab==='friction'){let d=s.lagDeg*rad;return {'lag δ':s.lagDeg,'torque (two-point bulge, units GM☾m_b/R⊕²)':model.bulgeForces(60.3,d).torque,'first-order −3 sin 2δ / D³':model.bulgeTorqueFirstOrder(60.3,d),'day lengthens':'2.3 ms per century','stretch across Moon / stretch across Earth':model.stretchRatioEarthOnMoon(),'Earth on Moon 2GM⊕R☾/d³':model.tidalAccelAcross(K.M_EARTH,K.R_MOON,K.D_MOON),'Moon on Earth 2GM☾R⊕/d³':model.tidalAccelAcross(K.M_MOON,K.R_EARTH,K.D_MOON)}}if(tab==='spiral'){let e=model.evolve(s.tGyr*1e9*K.YEAR);return {'t':s.tGyr,'a':e.a/K.R_EARTH,'day length':e.day,'month (sidereal)':e.month,'orbital speed v':e.v,'L_spin':e.Lspin,'L_orb':e.Lorb,'L_total (constant)':e.Ltot,'Moon recedes (model)':'4.2 cm/yr today (laser ranging: 3.8)','locks at':`${fmt(lock.a/K.R_EARTH,1)} R⊕, ${fmt(lock.P/86400,1)} d, +${fmt(maxT,1)} Gyr (this model)`}}let rr=model.rocheRadius(s.rhoP,s.rhoM,s.Rp),rig=model.rocheRadius(s.rhoP,s.rhoM,s.Rp,K.F_RIGID),g=model.selfGravity(s.rhoM,s.Rm),t=model.tidalAtSatellite(s.rhoP,s.Rp,s.Rm function displayReadouts(){let o=readouts(),s=S[tab];return Object.entries(o).map(([k,v])=>{let text=typeof v==='number'?sig(v):v;if(tab==='stretch'){if(k==='d / R')text=fmt(v,1);if(k.startsWith('exact')||k.startsWith('first order'))text=v.toPrecision(6);if(k.startsWith('relative'))text=fmt(v,3)+' %';if(k.startsWith('ocean')&&typeof v==='number')text=fmt(v,2)+' m';if(k.startsWith('ΔF/m'))text=sig(v)+' m s⁻²'}if(tab==='tides'){if(k==='ΔF☉ / ΔF☾')text=fmt(v,2)+' ≈ 5/11';if(k.includes('amplitude'))text=fmt(v,3)+' m';if(k.includes('range'))text=fmt(v,2)+' m';if(k==='time between high tides')text='12 h 25 min';if(k==='height at observer now')text=fmt(v,3)+' m'}if(tab==='friction'&&k==='lag δ')text=fmt(v,1)+'°';if(tab==='friction'&&(k.startsWith('Earth on Moon')||k.startsWith('Moon on Earth')))text=sig(v)+' m s⁻²';if(tab==='friction'&&k.startsWith('stretch across'))text=fmt(v,0)+' ≈ 20';if(tab==='spiral'){let e=model.evolve(s.tGyr*1e9*K.YEAR);if(k==='t')text=fmt(v,2)+' Gyr';if(k==='a')text=fmt(v,1)+' R⊕ = '+Math.round(e.a/1000).toLocaleString()+' km';if(k==='day length')text=day(v);if(k==='month (sidereal)')text=fmt(v/86400,1)+' d';if(k==='orbital speed v')text=fmt(v,0)+' m/s';if(k==='L_spin'||k==='L_orb')text=sig(v)+' ('+fmt(k==='L_spin'?e.fracSpin*100:e.fracOrb*100,0)+'%)'}if(tab==='roche'){if(k==='satellite mass')text=sig(v)+' kg';if(k.startsWith('self-gravity')||k.startsWith('tidal stretch'))text=sig(v)+' m s⁻²';if(k==='Roche limit r_R'||k==='rigid estimate')text=fmt(v,2)+' R_p = '+km(v*s.Rp).toLocaleString()+' km';if(k==='10¹⁶ kg of ice is a body of radius')text=fmt(v,1)+' km ≈ 13 km'}return `<div><span class="metric-label">${k}</span><b>${text}</b></div>`}).join('')}
function canvasSize(canvas,c){let r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));c.setTransform(d,0,0,d,0,0);return [r.width,r.height]}

const formulas={stretch:[String.raw`F_1=\frac{GMm}{(d-R)^2},\quad F_2=\frac{GMm}{(d+R)^2}`,String.raw`\Delta F=F_2-F_1=\frac{GMm}{d^2}\left[(1+\tfrac Rd)^{-2}-(1-\tfrac Rd)^{-2}\right]`,String.raw`(1+x)^n\approx1+nx\Rightarrow\Delta F\approx-\frac{4GMmR}{d^3}`,String.raw`\vec a_{\rm tidal}\approx\frac{GM}{d^3}(2x,-y,-z)`],tides:[String.raw`\frac{\Delta F_\odot}{\Delta F_{\rm Moon}}=\frac{M_\odot}{M_{\rm Moon}}\left(\frac{d_{\rm Moon}}{d_\odot}\right)^3`,String.raw`\zeta(\psi)=\frac{M}{M_\oplus}\left(\frac{R_\oplus}{d}\right)^3 R_\oplus P_2(\cos\psi)`,String.raw`\text{spring}=\frac32(H_{\rm Moon}+H_\odot),\quad\text{neap}=\frac32(H_{\rm Moon}-H_\odot)`,String.raw`T_{\rm high}=\frac12\frac{24\ \mathrm h}{1-24\ \mathrm h/29.53\ \mathrm d}`],friction:[String.raw`\tau\approx-\frac{3GM_{\rm Moon}m_bR_\oplus^2}{d^3}\sin2\delta`,String.raw`\frac{dL_{\rm spin}}{dt}=\tau,\quad\frac{dL_{\rm orb}}{dt}=-\tau`,String.raw`\dot P_{\rm day}\approx2.3\ \mathrm{ms\ per\ century}`,String.raw`\frac{\Delta F_{\oplus\to\rm Moon}}{\Delta F_{{\rm Moon}\to\oplus}}=\frac{M_\oplus R_{\rm Moon}}{M_{\rm Moon}R_\oplus}\approx22`],spiral:[String.raw`L_{\rm orb}=\mu\sqrt{GM_{\rm tot}a}\propto\sqrt a`,String.raw`v=\frac{2\pi a}{P}=\sqrt{\frac{GM_{\rm tot}}a}\propto a^{-1/2}`,String.raw`I_\oplus\omega+\mu\sqrt{GM_{\rm tot}a}=L_{\rm tot}`,String.raw`\frac{da}{dt}=\dot a_0\left(\frac{a_0}{a}\right)^{11/2}\Rightarrow a(t)=\left[a_0^{13/2}+\frac{13}{2}\dot a_0a_0^{11/2}t\right]^{2/13}`],roche:[String.raw`\frac{GM_m}{R_m^2}<\frac{2GM_pR_m}{r^3}`,String.raw`r_{\rm rigid}=2^{1/3}\left(\frac{\rho_p}{\rho_m}\right)^{1/3}R_p`,String.raw`r_{\rm Roche}=f_R\left(\frac{\rho_p}{\rho_m}\right)^{1/3}R_p,\quad f_R=2.456`,String.raw`R=\left(\frac{3M}{4\pi\rho}\right)^{1/3}`]};
const notes={stretch:"The minus sign says the far side is pulled less. Subtracting the centre's pull leaves a field that stretches the body along the line to the primary and squeezes it across: a football. On Earth the result is a bulge of about half a metre; the ellipse and residual arrows are magnified.",tides:"The Moon raises the larger bulge; the Sun's adds to it at new and full Moon (spring tides) and fights it at the quarters (neap tides). Bulges are drawn 1.8 million times too tall: the real equilibrium tide is half a metre on a 6371-km Earth.",friction:"Friction drags the bulge ahead of the Earth–Moon line. The Moon pulls the near bulge back harder than it pulls the far bulge forward, so the net torque brakes Earth's spin and flexing turns into heat. The same torque locked the Moon's rotation to its orbit long ago.",spiral:"Higher orbits are slower but hold more angular momentum, so a forward push lifts the Moon and slows it. Earth's spin pays for it until day = month ≈ 47 days at ≈ 87 R⊕ (this model: in ≈ 14 Gyr; realistic estimates are longer, and the Sun will have intervened).",roche:"Lecture example: an icy body at Saturn is torn apart inside 2.04 R_p ≈ 122,000 km, within the rings. The two-point inequality gives 2¹ᐟ³ ≈ 1.26; Roche's 2.456 is for a fluid body that stretches as it falls inward and so breaks up almost twice as far out."};
notes.stretch="The minus sign says the far side is pulled less. Subtracting the centre's pull leaves a field that stretches the body along the line to the primary and squeezes it across: a football. On Earth the result is a bulge of about half a metre; the ellipse and the residual arrows here are magnified.";
notes.tides="The Moon raises the larger bulge; the Sun's adds to it at new and full Moon (spring tides) and fights it at the quarters (neap tides). Bulges are drawn 1.8 million times too tall: the real equilibrium tide is half a metre on a 6371-km Earth.";
notes.friction="Friction drags the bulge ahead of the Earth–Moon line. The Moon pulls the near bulge back harder than it pulls the far bulge forward, so the net torque brakes Earth's spin and the flexing turns into heat. The same torque, acting the other way, locked the Moon's rotation to its orbit long ago.";
notes.spiral="Higher orbits are slower but hold more angular momentum, so a forward push lifts the Moon and slows it. Earth's spin pays for it until day = month ≈ 47 days at ≈ 87 R⊕ (this model: in ≈ 14 Gyr; realistic estimates are longer, and the Sun will have intervened).";
notes.roche="Lecture example: an icy body (ρ ≈ 1200 kg m⁻³) at Saturn (R_p = 60,000 km, ρ_p ≈ 690) is torn apart inside 2.04 R_p ≈ 122,000 km, within the rings. The two-point inequality gives 2^{1/3} ≈ 1.26; Roche's 2.456 is for a fluid body that stretches as it falls inward and so breaks up almost twice as far out.";
