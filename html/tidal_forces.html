const metadata={stretch:['Geometry','Differential gravity across a body',"Left: the pull of M at every point · Right: the same arrows minus the centre’s arrow · residual arrows magnified · distance axis logarithmic",'Exact versus first order',"1. Drag left–right on the left view (or use the slider) to move the other body (mass M).<br>2. Compare the two halves: equal-looking arrows on the left become a stretch-and-squeeze pattern on the right.<br>3. Press ‘Subtract the centre’s pull’ to see how the right panel is made from the left.<br>4. Watch the lower chart: the first-order formula is excellent once d ≳ 10 R.","All thirteen arrows point at the other body (mass M) and differ only slightly; the difference is the tide. The residual field stretches along the line and squeezes across it.","The other body (mass M) is a point mass; exact inverse-square forces at thirteen points of a rigid sphere, residual = force minus the force at the centre. The ellipse is a fixed 1.16 : 0.92 illustration, not the computed equilibrium shape. The real equilibrium ocean tide on Earth is 0.54 m peak-to-trough for the Moon and 0.25 m for the Sun. Residual arrows are rescaled so the largest is always visible."],tides:['Moon, Sun and observer','Two bulges: Moon and Sun','View from above the north pole · Sun to the right · bulges exaggerated ≈ 1.8 million times · Moon orbit not to scale','Tide height at the observer over one month','1. Press ▶ and watch the observer sweep through two high tides a day while the Moon creeps around its orbit.<br>2. Drag the Moon to new, quarter and full positions and read the range.<br>3. Turn the Sun off to see the Moon-only tide.',"The bulge follows the Moon. High tides are 12 h 25 min apart because the Moon has moved on by the time Earth turns once.","Equilibrium tide: ocean surface height ζ = H·P₂(cos ψ) for each body, summed; observer on the equator; Sun direction fixed; Earth turns once per solar day and the Moon advances at the synodic rate. No Love numbers, ocean dynamics, latitude or lunar declination. Bulge heights are magnified ×1.8 million; the Moon's orbit is drawn at a fixed radius (true: 60 R⊕). High tide is H above the undisturbed sea but low tide only H/2 below it, so the month curve is not centred on zero."],friction:['Lag and spin','Lagging bulge, braking torque','Lag angle and bulge height exaggerated (textbook lag ≈ 3°, bulge ≈ 0.5 m) · Moon distance not to scale','The same torque on the Moon: spin-down to lock','1. Slide the lag angle through zero and watch the torque arrow flip.<br>2. Turn on “Animate spin”: the surface moves through a bulge that stays put.<br>3. In the lower panel press “Let tides act”: the Moon’s bulge lag shrinks as its spin slows, until it is locked (s = 1).',"Only the tangential parts of the two pulls make torque, and the near bulge wins because it is closer. The reaction pushes the Moon forward along its orbit.","Two point bulges of mass m_b at ±R⊕(1.16) along an axis leading by δ; exact inverse-square pulls from the Moon at the true 60.3 R⊕ (the Moon is drawn closer). The lag angle, bulge height and Moon size are exaggerated."],spiral:['Time','Earth and Moon, to scale in distance','Distances to scale (1 tick = 10 R⊕) · Earth and Moon drawn no smaller than 6 px and 4 px · constant-rate model, past is an extrapolation','Angular-momentum budget','1. Scrub time (or press ▶). The Moon drifts out, its speed arrow shrinks, the day stretches.<br>2. Watch the budget: whatever the spin loses, the orbit gains.<br>3. Go to the end: day = month, the torque is gone.',"v falls as a⁻¹ᐟ² while L rises as a¹ᐟ²: speeding the Moon up ends with it moving slower. Earth's spin is only 17% of the budget today.","Angular momentum: Earth's spin plus the Moon's circular orbit about the barycentre, total conserved. The Sun's tide, solar-orbit angular momentum, the Moon's spin, obliquity and past orbital eccentricity are ignored. Torque today is set by 2.3 ms per century, giving 4.2 cm/yr (laser ranging: 3.8 cm/yr). The rate scales as a⁻¹¹ᐟ²; the past is an extrapolation because today's ocean dissipation is unusually strong."],roche:['Planet and satellite','A satellite approaching its planet','Planet and distances to scale · satellite enlarged · deformation and break-up schematic','Self-gravity versus tidal stretch','1. Drag the satellite toward Saturn. It stretches, then breaks into a ring inside the magenta circle.<br>2. Change the satellite density: ice breaks up farther out than rock.<br>3. Change its radius: the circles do not move.',"The limit depends on the density ratio and the planet's radius, not on the satellite's size: both self-gravity and tidal stretch are proportional to R_m. Saturn's rings sit around the limit for ice.","M_p = (4/3)πρ_pR_p³ from the preset values. Slide 11 rounds Roche's coefficient to 2.44, which gives 2.03 R_p; 2.456 gives 2.04 R_p — both ≈ 122,000 km. The rigid estimate is 2¹ᐟ³ ≈ 1.26; Roche's 2.456 is for a fluid body that stretches as it approaches. Small bodies can be held together by material strength. Deformation and debris are schematic."]};
metadata.stretch.splice(4,3,"1. Drag left–right on the left view (or use the slider) to move the other body (mass M).<br>2. Compare the two halves: equal-looking arrows on the left become a stretch-and-squeeze pattern on the right.<br>3. Press ‘Subtract the centre’s pull’ to see how the right panel is made from the left.<br>4. Watch the lower chart: the first-order formula is excellent once d ≳ 10 R.","All thirteen arrows point at the other body (mass M) and differ only slightly; the difference is the tide. The residual field is ×2 outward along the line and ×1 inward across it, so the shape is a football, not a teardrop.","The other body (mass M) is a point mass; exact inverse-square forces at thirteen points of a rigid sphere, residual = force minus the force at the centre. The ellipse is a fixed 1.16 : 0.92 illustration, not the computed equilibrium shape; the real equilibrium ocean tide on Earth is 0.54 m peak-to-trough for the Moon and 0.25 m for the Sun (equilibrium theory, no Love numbers). Each point shares the centre's pull; removing it leaves the small difference shown on the right. Residual arrows are magnified so the largest is visible.");
metadata.tides.splice(4,3,"1. Press ▶ and watch the observer sweep through two high tides a day while the Moon creeps around its orbit.<br>2. Drag the Moon to new, quarter and full positions and read the range.<br>3. Turn the Sun off to see the Moon-only tide.","The bulge follows the Moon, not the Sun: the Sun is 27 million times more massive but 390 times farther, and tides fall as 1/d³. High tides are 12 h 25 min apart because the Moon has moved on by the time Earth turns once.","Equilibrium tide: ocean surface height ζ = H·P₂(cos ψ) for each body with H = (M/M⊕)(R⊕/d)³R⊕, summed; observer on the equator; Sun direction fixed; Earth turns once per solar day and the Moon advances at the synodic rate. No Love numbers, ocean dynamics, latitude or lunar declination. Bulge heights are magnified ×1.8 million; the Moon's orbit is drawn at a fixed radius (true: 60 R⊕).");
metadata.friction.splice(4,3,"1. Slide the lag angle through zero and watch the torque arrow flip.<br>2. Turn on “Animate spin”: the surface moves through a bulge that stays put.<br>3. In the lower panel press “Let tides act”: the Moon’s bulge lag shrinks as its spin slows, until it is locked (s = 1). Watch the dark maria show which side faces Earth.","Only the tangential parts of the two pulls make torque, and the near bulge wins because it is closer. The reaction pushes the Moon forward along its orbit: that is where Earth's lost spin goes.","Two point bulges of mass m_b at ±R⊕(1.16) along an axis leading by δ; exact inverse-square pulls from the Moon at the true 60.3 R⊕ (the Moon is drawn closer). The first-order torque is −3GM m_b R² sin 2δ / d³. The lag angle, bulge height and Moon size are exaggerated; the 2.3 ms per century and the ≈20× ratio are the lecture's values. The Moon’s tidal bulge is in its rock; the dark maria mark its near side.");
metadata.spiral.splice(4,3,"1. Scrub time (or press ▶). The Moon drifts out, its speed arrow shrinks, the day stretches.<br>2. Watch the budget: whatever the spin loses, the orbit gains.<br>3. Go to the end: day = month, the bulge sits on the Earth–Moon line, and the torque is gone.","v falls as a^{-1/2} while L rises as a^{1/2}: speeding the Moon up ends with it moving slower. The Earth's spin is only 17 % of the budget today; by the lock it is under 1 %.","Angular momentum: Earth's spin (I = 0.3307 M⊕R⊕², sidereal ω) plus the Moon's circular orbit about the barycentre (μ√(GM_tot a)), total conserved; the Sun's tide is ignored, and so is the Moon's own spin (locked, I = 0.394 M☾R☾²: about 7 parts per million of the total). Torque today is set so the day lengthens 2.3 ms per century (slide 9), which gives 4.2 cm/yr recession (lunar laser ranging: 3.8 cm/yr). The rate is scaled as a^{-11/2} (constant lag angle), which integrates to the closed form shown; it ends at the lock where ω = n, a = 86.9 R⊕, P = 47.2 d, after 13.7 Gyr here. Run backwards the same law puts the Moon at Earth's surface 1.4 Gyr ago, which is wrong (the Moon is 4.5 Gyr old): today's ocean tides are unusually dissipative, so the past is marked as an extrapolation and the slider stops at −1 Gyr.");
metadata.roche[2]='The stretch is radial, but the spreading is along the orbit: inner pieces go round faster.';
metadata.roche.splice(4,3,"1. Drag the satellite toward Saturn. It stretches, then breaks into a ring inside the magenta circle.<br>2. Change the satellite's density: ice breaks up farther out than rock.<br>3. Change its radius: the circles do not move.","The limit depends on the density ratio and the planet's radius, not on the satellite's size: both self-gravity and tidal stretch are proportional to R_m. Saturn's rings sit around the limit for ice.","The pieces start close together and co-rotate with the moon; inner pieces then move ahead and outer pieces fall behind, forming a narrow ring on the same orbit. The pieces' average orbits span about {{ring}} km; each also swings in and out, so the band is up to about {{band}} km wide until collisions damp the swing. This model ignores collisions, fragment self-gravity and planet oblateness; real rings broaden through collisions over millions of years. Phobos is spiralling toward Mars and is expected to break up into a ring within a few tens of millions of years.");
const railMath={

function mathText(el,text){el.replaceChildren();let parts=text.split(/\$([^$]+)\$/);parts.forEach((part,i)=>{if(i%2){let span=document.createElement('span');renderInline(span,part);el.append(span)}else el.append(document.createTextNode(part))})}
function proseMath(text){for(let [from,to] of [["f_R = 2.456",String.raw`$f_R = 2.456$`],["M_p = (4/3)πρ_pR_p³",String.raw`$M_p=(4/3)\pi\rho_p R_p^3$`],["I = 0.3307 M⊕R⊕²",String.raw`$I=0.3307M_\oplus R_\oplus^2$`],["μ√(GM_tot a)",String.raw`$\mu\sqrt{GM_{\rm tot}a}$`],["a^{-11/2}",String.raw`$a^{-11/2}$`],["a^{-1/2}",String.raw`$a^{-1/2}$`],["a^{1/2}",String.raw`$a^{1/2}$`],["2^{1/3}",String.raw`$2^{1/3}$`],["R_m",String.raw`$R_m$`],["R_p",String.raw`$R_p$`],["ρ_p",String.raw`$\rho_p$`],["m_b",String.raw`$m_b$`]])text=text.split(/(\$[^$]*\$)/).map((segment,i)=>i%2?segment:segment.split(from).join(to)).join('');return text}

function slider(label,key,min,max,step,value,log=false,scale=1){return `<div class="field"><div class="field-label">${label}</div><div class="field-row"><input type="range" data-key="${key}" data-log="${log?1:0}" data-scale="${scale}" min="${min}" max="${max}" step="${step}" value="${log?Math.log10(value/scale):value/scale}"><input class="num-input" type="number" data-num="${key}" data-scale="${scale}" value="${Number((value/scale).toPrecision(6))}"></div></div>`}
function toggle(label,key,on){return `<label class="small"><input class="toggle" type="checkbox" data-toggle="${key}" ${on?'checked':''}> ${label}</label><br>`}function chip(label,action){return `<button class="chip" data-action="${action}">${label}</button>`}
function controlsHtml(){let s=S[tab];if(tab==='stretch')return slider('Distance d / R','D',.398,4.477,.005,s.D,true)+['Teaching · d = 10 R','Moon → Earth · 60.3 R⊕','Sun → Earth · 23,482 R⊕','Earth → Moon · 221 R☾'].map((x,i)=>chip(x,'pair'+i)).join('')+toggle('Show interior points','interior',s.interior);if(tab==='tides')return chip('▶ / pause','play')+chip('Reset','reset')+slider('Speed (hours per second)','speed',1,48,1,s.speed)+slider('Moon position (°)','thetaM0',0,360,1,s.thetaM0,false,rad)+slider('Observer longitude (°)','obsLon',0,360,5,s.obsLon,false,rad)+toggle("Include the Sun's tide",'sunOn',s.sunOn)+['New Moon · spring','First quarter · neap','Full Moon · spring','Third quarter · neap'].map((x,i)=>chip(x,'phase'+i)).join('');if(tab==='friction')return slider('Lag angle δ (°)','lagDeg',-20,20,.5,s.lagDeg)+['Today · δ = 3°','Locked · δ = 0','Spin slower than orbit · δ = −3°'].map((x,i)=>chip(x,'lag'+i)).join('')+toggle('Animate spin','animateSpin',s.animateSpin)+chip('Orbit ▶ / pause','orbit')+slider('Spin per orbit s','spinRatio',0,3,.01,s.spinRatio)+chip('Let tides act ▶ / pause','evolve')+chip('Reset (s = 2.5)','resetSpin')+['0','1 (locked)','2'].map((x,i)=>chip(x,'spin'+i)).join('');if(tab==='spiral')return slider('Time from today (Gyr)','tGyr',-1,maxT,.01,s.tGyr)+chip('▶ / pause','play')+slider('Speed (Gyr per second)','speed',.1,2,.1,s.speed)+['Reset to today','−1 Gyr','today','+1 Gyr','+5 Gyr','locked'].map((x,i)=>chip(x,'time'+i)).join('');let modes=chip('Moon on a circular orbit','modeCircular')+chip('Star passing a black hole','modePlunge');if(s.mode==='plunge')return modes+slider('pericentre r_p / r_t','rpOverRt',.5,2,.01,s.rpOverRt)+chip('Just inside (r_p = 0.9 r_t)','justInside')+`<div class="field"><div class="field-label">time since pericentre</div><div class="field-row"><input type="range" data-key="tDays" min="${Math.asinh(-2)}" max="${Math.asinh(400)}" step=".005" value="${Math.asinh(s.tDays)}"><input class="num-input" type="number" data-num="tDays" step="any" value="${Math.abs(s.tDays)<2?s.tDays*24:s.tDays}"></div><div class="small" data-time-unit>${Math.abs(s.tDays)<2?'hours':'days'}</div></div>`+chip('▶ / pause','play');return modes+['Saturn','Jupiter','Earth','Sun'].map((x,i)=>chip(x,'primary'+i)).join('')+slider('ρ_p (kg m⁻³)','rhoP',300,6000,10,s.rhoP)+slider('R_p (km)','Rp',3,6,.005,s.Rp,true,1000)+['Icy · 1200','Comet · 500','Rocky · 3000','Moon-like · 3340'].map((x,i)=>chip(x,'density'+i)).join('')+slider('ρ_m (kg m⁻³)','rhoM',300,6000,10,s.rhoM)+slider('R_m (km)','Rm',0,Math.log10(2000),.005,s.Rm,true,1000)+slider('Distance r / R_p','r',1.05,6,.01,s.r)+`<div class="field"><div class="field-label">orbits since break-up</div><div class="field-row"><input type="range" data-key="orbits" min="-1.01" max="4" step=".01" value="${s.orbits?Math.log10(s.orbits):-1.01}"><input class="num-input" type="number" data-num="orbits" min="0" max="10000" step="any" value="${Number(s.orbits.toPrecision(4))}"></div><div class="small" data-debris-hint>${debrisActive()?'Move to the left end for break-up (0 orbits).':'Move the satellite inside the Roche limit to enable.'}</div></div>`+chip('▶ / pause','debrisPlay')+chip('Lecture example','lecture')}
function installControls(){railLabels();let s=S[tab];$('controls').querySelectorAll('[data-key],[data-num]').forEach(el=>el.oninput=()=>{let key=el.dataset.key||el.dataset.num,v=Number(el.value)*(Number(el.dataset.scale)||1);if(el.dataset.log==='1')v=10**Number(el.value)*(Number(el.dataset.scale)||1);if(key==='tDays')v=el.dataset.key?Math.sinh(Number(el.value)):Number(el.value)/(Math.abs(s.tDays)<2?24:1);if(key==='orbits'&&el.dataset.key)v=Number(el.value)<=-1.01?0:10**Number(el.value);let bounds={D:[2.5,30000],speed:tab==='tides'?[1,48]:[.1,2],thetaM0:[0,2*pi],obsLon:[0,2*pi],lagDeg:[-20,20],spinRatio:[0,3],tGyr:[-1,maxT],rhoP:[300,6000],rhoM:[300,6000],Rp:[1e6,1e9],Rm:[1e3,2e6],r:[1.05,6],orbits:[0,10000],rpOverRt:[.5,2],tDays:[-2,400]};if(bounds[key])v=clamp(v,...bounds[key]);s[key]=v;paint();renderMath();syncControls(el)});$('controls').querySelectorAll('[data-toggle]').forEach(el=>el.onchange=()=>{s[el.dataset.toggle]=el.checked;paint();renderMath();startLoop()});$('controls').querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{let a=el.dataset.action,i=Number(a.slice(-1));if(a==='modeCircular'||a==='modePlunge'){s.mode=a==='modeCircular'?'circular':'plunge';s.playing=false;setTab('roche');return}if(a==='justInside')s.rpOverRt=.9;if(a.startsWith('pair')){s.pair=['moonEarth','moonEarth','sunEarth','earthMoon'][i];s.D=i===0?10:pairs[s.pair].d/pairs[s.pair].R}if(a.startsWith('phase')){s.thetaM0=i*pi/2;s.t=0}if(a.startsWith('lag'))s.lagDeg=[3,0,-3][i];if(a.startsWith('spin'))s.spinRatio=i;if(a==='debrisPlay')s.playing=!s.playing;if(a==='evolve'){if(!s.evolving&&Math.abs(s.spinRatio-1)<.01){s.spinRatio=2.5;s.tEvolve=0;s.history=[[0,2.5]]}if(!s.evolving)s.faceAngle=s.spinRatio*s.orbitAngle+pi;s.evolving=!s.evolving;s.orbitPlaying=true;if(s.evolving&&s.tEvolve===0)s.history=[[0,s.spinRatio]]}if(a==='resetSpin'){s.spinRatio=2.5;s.tEvolve=0;s.history=[[0,2.5]];s.evolving=false}if(a==='orbit')s.orbitPlaying=!s.orbitPlaying;if(a==='play'){if(tab==='roche'&&s.mode==='plunge'&&!s.playing&&s.tDays>=400)s.tDays=-2;s.playing=!s.playing};if(a==='reset')Object.assign(s,{t:0,thetaM0:50*rad,obsLon:0});if(a.startsWith('time'))s.tGyr=[0,-1,0,1,5,maxT][i];if(a.startsWith('primary')){let p=[[6e7,690,'saturn'],[71492000,1326,'jupiter'],[6371000,5514,'earth'],[696e6,1408,'sun']][i];[s.Rp,s.rhoP,s.primary]=p}if(a.startsWith('density'))s.rhoM=[1200,500,3000,3340][i];if(a==='lecture')Object.assign(s,{Rp:6e7,rhoP:690,rhoM:1200,Rm:13000,r:3,primary:'saturn',orbits:0,playing:false});$('controls').innerHTML=controlsHtml();installControls();paint();renderMath();startLoop()})}
function syncControls(skip){$('controls').querySelectorAll('[data-key],[data-num]').forEach(el=>{if(el===skip)return;let key=el.dataset.key||el.dataset.num,v=S[tab][key]/(Number(el.dataset.scale)||1);if(key==='tDays'){el.value=el.dataset.key?Math.asinh(v):Number((Math.abs(v)<2?v*24:v).toPrecision(5));let u=$('controls').querySelector('[data-time-unit]');if(u)u.textContent=Math.abs(v)<2?'hours':'days';return}el.value=key==='orbits'&&el.dataset.key?(v?Math.log10(v):-1.01):el.dataset.log==='1'?Math.log10(v):Number(v.toPrecision(key==='orbits'?4:6))})}
function readouts(){let s=S[tab];if(tab==='stretch'){let p=pairs[s.pair],x=1/s.D;return {'d / R':s.D,'exact [(1+R/d)⁻² − (1−R/d)⁻²]':model.tidalBracketExact(x),'first order −4R/d':model.tidalBracketApprox(x),'relative error ≈ 2(R/d)²':200*x*x,'ΔF/m across the diameter at this d':model.deltaForcePerMass(p.M,p.R,p.R*s.D),'ΔF/m at the real distance':model.deltaForcePerMass(p.M,p.R,p.d),'ocean bulge (equilibrium) at the real distance':s.pair==='earthMoon'?'—':1.5*model.equilibriumTideHeight(p.M,p.d)}}if(tab==='tides'){let f=model.tideFrame(s.t,s.thetaM0,s.obsLon),h=s.sunOn?hs:0,e=model.tideEnvelope(f.thetaM,0,hm,h);return {'ΔF☉ / ΔF☾':model.sunMoonRatio(),'Moon tide amplitude H☾':hm,'Sun tide amplitude H☉':hs,'range now (peak-to-trough)':2*e.amp,'spring range':1.5*(hm+hs),'neap range':1.5*(hm-hs),'time between high tides':model.lunarHighTideInterval(),'phase':model.phaseName(f.thetaM),'height at observer now':model.tideHeightAt(f.phi,f.thetaM,0,hm,h)}}if(tab==='friction'){let d=s.lagDeg*rad;return {'lag δ':s.lagDeg,"Earth's spin / orbit today":(2*pi/model.n(model.a0))/K.SIDEREAL_DAY,'torque (two-point bulge, units GM☾m_b/R⊕²)':model.bulgeForces(60.3,d).torque,'first-order −3 sin 2δ / D³':model.bulgeTorqueFirstOrder(60.3,d),'day lengthens':'2.3 ms per century','stretch across Moon / stretch across Earth':model.stretchRatioEarthOnMoon(),'Earth on Moon 2GM⊕R☾/d³':model.tidalAccelAcross(K.M_EARTH,K.R_MOON,K.D_MOON),'Moon on Earth 2GM☾R⊕/d³':model.tidalAccelAcross(K.M_MOON,K.R_EARTH,K.D_MOON)}}if(tab==='spiral'){let e=model.evolve(s.tGyr*1e9*K.YEAR);return {'t':s.tGyr,'a':e.a/K.R_EARTH,'day length':e.day,'month (sidereal)':e.month,'orbital speed v':e.v,'L_spin':e.Lspin,'L_orb':e.Lorb,'L_total (constant)':e.Ltot,'L_Moon spin (locked)':model.LspinMoon(e.a),'Moon recedes (model)':'4.2 cm/yr today (laser ranging: 3.8)','locks at':`${fmt(lock.a/K.R_EARTH,1)} R⊕, ${fmt(lock.P/86400,1)} d, +${fmt(maxT,1)} Gyr (this model)`}}if(s.mode==='plunge'){let q=plungeData(),v=Math.sqrt(2*model.TDE_MU/q.rp);return {'tidal radius':`${fmt(q.rt/K.D_SUN,3)} au · ${fmt(q.rt/K.R_SUN,0)} R☉`,'pericentre speed':`${fmt(v/1000,0)} km/s · ${fmt(v/299792458,3)} c`,'state':s.tDays<0?'approaching':s.rpOverRt<=1?'disrupted':'passed intact','bound fraction':s.rpOverRt<=1?fmt(q.fracBound,2):'0','most-bound gas returns after':s.rpOverRt<=1?`≈ ${fmt(q.tMinDays,1)} days`:'—','peak fallback rate':s.rpOverRt<=1?`${fmt(q.peak.mdot,2)} M☉/yr at ${fmt(q.peak.tDays,1)} days`:'—'}}let rr=model.rocheRadius(s.rhoP,s.rhoM,s.Rp),rig=model.rocheRadius(s.rhoP,s.rhoM,s.Rp,K.F_RIGID),g=model.selfGravity(s.rhoM,s.Rm),t=model.tidalAtSatellite(s.rhoP,s.Rp,s.Rm,s.r*s.Rp);let out={'Roche limit r_R':rr/s.Rp,'rigid estimate':rig/s.Rp,'ratio r_R / rigid':rr/rig,'satellite mass':model.satelliteMass(s.rhoM,s.Rm),'self-gravity GM_m/R_m²':g,'tidal stretch 2GM_pR_m/r³':t,'tidal / self-gravity':t/g,'state':model.disruptionState(s.r*s.Rp,rr,rig)};let radius=s.r*s.Rp,period=model.orbitalPeriod(radius,s.rhoP,s.Rp),close=model.ringCloseOrbits(radius,s.Rm),years=model.ringCloseTime(radius,s.Rm,s.rhoP,s.Rp)/K.YEAR;out['orbital period']=period/3600;out['spread at break-up']=3*s.Rm/1000;out['ring closes after']=`≈ ${fmt(close,0)} orbits ≈ ${years>=1?fmt(years,2)+' years':fmt(years*K.YEAR/86400,1)+' days'}`;out['ring width']=`${fmt(model.ringWidth(s.Rm)/1000,0)} km (${fmt(model.ringBandWidth(s.Rm)/1000,0)} km with the in-and-out swing)`;if(s.primary==='saturn'){out.rings='80,000–136,000 km: the limit lies inside them';out['10¹⁶ kg of ice is a body of radius']=model.radiusFromMass(1e16,1200)/1000}return out}
function displayReadouts(){let o=readouts(),s=S[tab];return Object.entries(o).map(([k,v])=>{let text=typeof v==='number'?sig(v):v;if(tab==='stretch'){if(k==='d / R')text=fmt(v,1);if(k.startsWith('exact')||k.startsWith('first order'))text=v.toPrecision(6);if(k.startsWith('relative'))text=fmt(v,3)+' %';if(k.startsWith('ocean')&&typeof v==='number')text=fmt(v,2)+' m';if(k.startsWith('ΔF/m'))text=sig(v)+' m s⁻²'}if(tab==='tides'){if(k==='ΔF☉ / ΔF☾')text=fmt(v,2)+' ≈ 5/11';if(k.includes('amplitude'))text=fmt(v,3)+' m';if(k.includes('range'))text=fmt(v,2)+' m';if(k==='time between high tides')text='12 h 25 min';if(k==='height at observer now')text=fmt(v,3)+' m'}if(tab==='friction'&&(k.startsWith('torque (')||k.startsWith('first-order')))text=Number(v).toExponential(2);if(tab==='friction'&&k==='lag δ')text=fmt(v,1)+'°';if(tab==='friction'&&(k.startsWith('Earth on Moon')||k.startsWith('Moon on Earth')))text=sig(v)+' m s⁻²';if(tab==='friction'&&k.startsWith('stretch across'))text=fmt(v,0)+' ≈ 20';if(tab==='spiral'){let e=model.evolve(s.tGyr*1e9*K.YEAR);if(k==='t')text=fmt(v,2)+' Gyr';if(k==='a')text=fmt(v,1)+' R⊕ = '+Math.round(e.a/1000).toLocaleString()+' km';if(k==='day length')text=day(v);if(k==='month (sidereal)')text=fmt(v/86400,1)+' d';if(k==='orbital speed v')text=fmt(v,0)+' m/s';if(k==='L_Moon spin (locked)')text=Number(v).toExponential(1)+' ('+fmt(100*v/e.Ltot,4)+' %)';if(k==='L_spin'||k==='L_orb')text=sig(v)+' ('+fmt(k==='L_spin'?e.fracSpin*100:e.fracOrb*100,0)+'%)'}if(tab==='roche'){if(k==='orbital period')text=fmt(v,2)+' h';if(k==='spread at break-up')text=fmt(v,1)+' km';if(k==='satellite mass')text=sig(v)+' kg';if(k.startsWith('self-gravity')||k.startsWith('tidal stretch'))text=sig(v)+' m s⁻²';if(k==='Roche limit r_R'||k==='rigid estimate')text=fmt(v,2)+' R_p = '+km(v*s.Rp).toLocaleString()+' km';if(k==='10¹⁶ kg of ice is a body of radius')text=fmt(v,1)+' km ≈ 13 km'}let value=String(text).split(/(\s+)/).map(token=>/\s+/.test(token)?token:`<span class="value-tok
