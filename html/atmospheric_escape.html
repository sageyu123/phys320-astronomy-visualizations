const {K,SPECIES,BODIES}=model,$=id=>document.getElementById(id),C={amber:'#ffcc66',cyan:'#56c7d9',magenta:'#ee65be',purple:'#a99bff',coral:'#ff7f66',green:'#56dc72',muted:'#979ea6',text:'#e7e9eb',grid:'rgba(151,158,166,.20)',bg:'#0d1015'};

const params=new URLSearchParams(location.search),embed=params.get('embed')==='1',main=$('mainCanvas'),sub=$('subCanvas'),cx=main.getContext('2d'),sx=sub.getContext('2d');let tab='maxwell',gas,boxes=[],subBoxes=[],raf=0,last=0,hits=[],sim;
const sp=id=>SPECIES.find(x=>x.id===id),body=id=>BODIES.find(x=>x.name===id),sig=x=>Number(x).toLocaleString('en-US',{useGrouping:false,maximumSignificantDigits:3}),sup=x=>String(x).replace(/[-0-9]/g,c=>({'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'}[c])),sci=x=>{if(!isFinite(x))return '∞';if(!x)return '0';let e=Math.floor(Math.log10(Math.abs(x)));return e<-3||e>=5?sig(x/10**e)+' × 10'+sup(e):sig(x)},Tret=s=>s.mode==='Typical T'?body(s.body).Ttyp:body(s.body).Tup;

const meta={maxwell:{title:'Gas in a box → Maxwellian',sub:'Same T, different masses',caption:'Molecules move at random and collide in pairs, trading energy. The histogram approaches the Maxwell curve. Hover a bar to see which molecules it counts.',how:'1. What a distribution is: hover a bar; try N = 50. <button class="chip" data-preset="1">Set up</button><br>2. Collisions build it: step repeatedly; try the other starts. <button class="chip" data-preset="2">Set up</button><br>3. Why this shape: watch the velocity component. <button class="chip" data-preset="3">Set up</button><br>4. What T and m do: change temperature and gas. <button class="chip" data-preset="4">Set up</button>',notice:'Set collisions to 0 and press Play: molecules fly and bounce, but the histogram stays as injected. Motion alone does not make a Maxwell curve; collisions do.<br>Inject Two opposite beams or Flat and step half a collision each: the film strip records each stage; by about 4 collisions each the starts look alike.<br>The initial spike spreads at the first collisions; after a few collisions each it approaches the Maxwell curve. Random collisions conserve energy and momentum; far more ways of sharing the energy resemble the Maxwell pattern.<br>Follow the magenta molecule: its speed jumps at collisions. Over time its speed frequencies match the crowd.<br>Total kinetic energy stays constant as collisions share it out.<br>Speeds scale as √(T/m): quadrupling T doubles speeds; H₂ is four times faster than O₂.',about:'A 3D kinetic model with isotropic, elastic, energy- and momentum-conserving collisions between neighbours. The Maxwell-molecule rule has the same equilibrium as hard spheres. Speeds are real; animation is slowed and its visual pace rises with temperature and falls with molecular mass. The box, collision rate and motion are slowed and enlarged for viewing. In real air at sea level a molecule collides about 7×10⁹ times per second and travels about 70 nm between collisions. With m = 32 × 1.67 × 10⁻²⁷ kg, O₂ at 300 K gives 394 and 482 m/s; using the atomic mass unit gives 395 and 484 m/s.',formula:[String.raw`P=nkT`,String.raw`n_v\,dv=n\left(\frac{m}{2\pi kT}\right)^{3/2}e^{-mv^2/2kT}4\pi v^2\,dv`,String.raw`v_p=\sqrt{2kT/m},\quad\langle v\rangle=\sqrt{8kT/\pi m},\quad v_{rms}=\sqrt{3kT/m}`,String.raw`v_p=\sqrt{2kT/m}`],note:'k = 1.38 × 10⁻²³ J/K; m = A × 1.66 × 10⁻²⁷ kg.'},escape:{title:'The high-speed tail beyond escape speed',sub:'How long the gas lasts (Jeans escape)',caption:'The high-speed tail leaks away: a small change in escape speed relative to thermal speed changes the fraction enormously.',how:'1. Choose a body and gas.<br>2. Compare typical and upper-atmosphere temperatures.<br>3. Switch to logarithmic scale to reveal the tail.',notice:'The tail is always present, even when it looks empty on a linear scale.<br>At ratios 1, 3 and 6 the faster fraction is about 39%, 6 × 10⁻⁶ and 3 × 10⁻²³.<br>Escape time rises rapidly; a factor of 6 is a safety margin.<br>Earth keeps helium at 300 K but loses it at 1000 K.',about:'Jeans escape describes molecules leaving the exobase, where collisions become rare. Time is the gas column nH divided by escaping flux, assuming an isothermal gas and an exobase at the surface radius. Real atmospheres have more gas below; this is an order-of-magnitude time. Non-thermal processes including photochemistry, ion pick-up and sputtering often dominate for heavy species on small bodies.',formula:[String.raw`v_{esc}=\sqrt{2GM/R}`,String.raw`v_{esc}>6v_{rms}`,String.raw`F(>v_{esc})=\operatorname{erfc}x+\frac{2x}{\sqrt\pi}e^{-x^2},\quad x=v_{esc}/v_p`,String.raw`t_{esc}\approx\frac{H}{v_p}\frac{2\sqrt\pi e^\lambda}{1+\lambda},\quad\lambda=\frac{v_{esc}^2}{v_p^2},\ H=\frac R\lambda`],note:''},retain:{title:'Escape speed vs. temperature',sub:'Escape speed / rms speed by gas',caption:'A body keeps a gas when its escape speed lies above the gas line at its temperature.',how:'1. Select a body on the chart or with its chip.<br>2. Compare typical and upper-atmosphere temperatures.<br>3. Change the factor and inspect the verdicts.',notice:'At 300 K the 6× rule says Earth keeps helium, yet its air has almost none.<br>At upper-atmosphere temperatures H₂ and He escape Earth.<br>Classic retention charts use about 10 times rms speed with typical temperatures.<br>The Moon cannot hold O₂ or CO₂; cold Titan keeps N₂.',about:'Escape speeds use mass and radius, with the 1-bar radius for giant planets. Typical temperatures follow the classic retention chart; upper-atmosphere values are approximate exobase temperatures from spacecraft measurements or dayside surface temperatures for airless bodies. Older charts predate Voyager 2 and place Triton near 3 km/s; its escape speed is 1.45 km/s.',formula:[String.raw`v_{esc}=\sqrt{2GM/R}`,String.raw`v_{rms}=\sqrt{3kT/m}\propto\sqrt T`,String.raw`\text{kept if }v_{esc}>f v_{rms}`,String.raw`v_{esc}/v_{rms}`],note:'Lines of constant gas sit at fixed f · vᵣₘₛ; moving a body to its hotter upper atmosphere moves it left, under more lines.'}};
