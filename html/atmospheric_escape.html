const {K,SPECIES,BODIES}=model,$=id=>document.getElementById(id),C={amber:'#ffcc66',cyan:'#56c7d9',magenta:'#ee65be',purple:'#a99bff',coral:'#ff7f66',green:'#56dc72',muted:'#979ea6',text:'#e7e9eb',grid:'rgba(151,158,166,.20)',bg:'#0d1015'};

const params=new URLSearchParams(location.search),embed=params.get('embed')==='1',main=$('mainCanvas'),sub=$('subCanvas'),cx=main.getContext('2d'),sx=sub.getContext('2d');let tab='maxwell',gas,boxes=[],subBoxes=[],raf=0,last=0,hits=[],sim;

function histogramCounts(){let vp=model.speeds(gas.A,gas.T).vp,bins=Array(30).fill(0);for(let v of model.gasStats(gas).speeds){let i=Math.floor(v/(3.2*vp)*30);if(i<30)bins[i]++}return bins.map(n=>n/gas.N)}

function updateHistogram(dt){let vp=model.speeds(gas.A,gas.T).vp, bins=Array(30).fill(0);for(let v of model.gasStats(gas).speeds){let i=Math.floor(v/(3.2*vp)*30);if(i<30)bins[i]++}bins=bins.map(n=>n/gas.N/(3.2*vp/30));let alpha=gas.N<=100?1:1-Math.exp(-dt/.35);sim.smooth=sim.smooth?bins.map((n,i)=>sim.smooth[i]+alpha*(n-sim.smooth[i])):bins}

const meta={maxwell:{title:'Gas in a box → Maxwellian',sub:'Same T, different masses',caption:'Molecules move at random and collide in pairs, trading energy. The histogram approaches the Maxwell curve. Hover a bar to see which molecules it counts.',how:'1. What a distribution is: hover a bar; try N = 50. <button class="chip" data-preset="1">Set up</button><br>2. Collisions build it: step repeatedly; try the other starts. <button class="chip" data-preset="2">Set up</button><br>3. Why this shape: watch the velocity component. <button class="chip" data-preset="3">Set up</button><br>4. What T and m do: change temperature and gas. <button class="chip" data-preset="4">Set up</button>',notice:'Set collisions to 0 and press Play: molecules fly and bounce, but the histogram stays as injected. Motion alone does not make a Maxwell curve; collisions do.<br>Inject Two opposite beams or Flat and step half a collision each: the film strip records each stage; by about 4 collisions each the starts look alike.<br>The initial spike spreads at the first collisions; after a few collisions each it approaches the Maxwell curve. Random collisions conserve energy and momentum; far more ways of sharing the energy resemble the Maxwell pattern.<br>Follow the magenta molecule: its speed jumps at collisions. Over time its speed frequencies match the crowd.<br>Total kinetic energy stays constant as collisions share it out.<br>Speeds scale as √(T/m): quadrupling T doubles speeds; H₂ is four times faster than O₂.',about:'A 3D kinetic model with isotropic, elastic, energy- and momentum-conserving collisions between neighbours. The Maxwell-molecule rule has the same equilibrium as hard spheres. Speeds are real; animation is slowed and its visual pace rises with temperature and falls with molecular mass. The box, collision rate and motion are slowed and enlarged for viewing. In real air at sea level a molecule collides about 7×10⁹ times per second and travels about 70 nm between collisions. With m = 3
