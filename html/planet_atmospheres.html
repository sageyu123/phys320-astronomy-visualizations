const meta={albedo:['Sunlight in, infrared out','Temperature vs distance','Sunlight intercepted by a planet is reflected or emitted as infrared.','1. Choose a planet or adjust its distance and albedo.<br>2. Compare slow and fast heat transport.<br>3. Compare computed and measured temperatures.','Mercury reaches about 694 K at perihelion. Spreading heat lowers temperature by √2. Venus is warmed by its greenhouse effect; giant planets can emit internal heat.','Blackbody balance with uniform Bond albedo. The cold night side represents no heat storage. Bond albedos from Wikipedia, “Albedo”; measured temperatures are standard values.'],scale:['Hydrostatic equilibrium','Pressure falls by e every scale height','Pressure below the parcel supports its weight.','1. Choose a body.<br>2. Adjust temperature, molecular weight or gravity.<br>3. Move and resize the parcel.','Hotter or lighter gas and weaker gravity increase scale height. Pressure falls by a factor e each H.','Isothermal ideal gas with constant gravity and composition. Giant-planet pressures refer to the 1-bar level.'],layers:['Temperature vs height (US Standard Atmosphere 1976)','Pressure: real profile vs one scale height','Ozone and high-energy sunlight heat different layers.','1. Move the altitude cursor.<br>2. Show heating and extend the profile.<br>3. Change solar activity.','Weather occurs in the troposphere, which cools 6.5 K per km. Ozone warms the stratosphere, making it stable and spreading clouds into layers. The mesopause near 86 km reaches 187 K; EUV and X-rays heat the thermosphere to about 1000 K depending on solar activity. Cold air aloft makes pressure at 86 km ten times lower than an 8.4 km exponential.','US Standard Atmosphere 1976 uses geopotential altitude and piecewise-linear temperature below 86 km, standard thermosphere formulas above, and adjustable upper temperature. Hydrostatic pressure assumes constant molecular mass and is modelled only below 86 km, where air is well mixed.'],magneto:["Earth's magnetosphere (noon–midnight plane)",'Pressure balance at the nose','The solar wind compresses the dayside magnetic field.','1. Choose a wind or adjust density and speed.<br>2. Toggle the shock, belts and field direction.<br>3. Compare the pressure curves.','Magnetic pressure falls as r⁻⁶: doubling wind pressure moves the nose inward by about 12%. A CME at 30 cm⁻³ and 800 km/s pushes it to about 6 Earth radii, inside geostationary orbit. A compass points north because geographic north is a magnetic south pole.','A dipole with equatorial surface field 0.31 G; typical surface values range from 0.25 to 0.65 G. Boundary current doubles the field. Magnetopause shape follows Shue et al. (1997); tail and compression are schematic.']};
meta.magneto=["Earth's magnetosphere (noon–midnight plane)",'Storm response','', '1. Choose a wind or adjust its density, speed and field.<br>2. Play or step through the cycle.<br>3. Compare the storm response.', 'Southward field opens magnetic flux and drives storms. Northward field leaves the magnetosphere mostly closed.', "Noon–midnight cross-section. The stand-off distances, bow shock, coupling, $\\mathrm{Kp}$, oval, polar cap and $\\mathrm{Dst}$ are computed (Shue et al. 1998; Farris & Russell 1994; Newell et al. 2007; Gussenhoven et al. 1983; O'Brien & McPherron 2000). The field-line shapes are schematic. The auroral oval is drawn as a schematic arc: its latitudes follow the model, but each arc is at least 10 px long on screen. Real reconnection is 3-D and continuous (Dungey 1961), and one cycle takes about 1–2 h. Solar-wind dot density is proportional to $n$ up to $40\\ \\mathrm{cm^{-3}}$. $B_y$ is fixed at 3 nT."];
meta.albedo[5]+=' Map credits: NASA Goddard Space Flight Center Scientific Visualization Studio (Earth and Moon); LRO/LROC (Moon); NASA/JPL/University of Arizona (Jupiter); NASA/USGS Astrogeology Science Center (Mercury); NASA (Mars, Saturn and Neptune). Venus and Uranus maps are procedural schematics, not images. The orthographic view ignores axial tilt; the 4 s spin period is schematic.';meta.albedo[4]='From Neptune the Sun looks 1/30 as wide as from Earth, covers 1/900 as much sky and delivers 1/900 as much light per m²: that is the √(R☉/r) in Tss. Each planet starts in its usual case: airless, slow Mercury and the Moon near Tss; planets with air or fast spin near Teq. '+meta.albedo[4];
meta.layers=["Where sunlight is absorbed sets the temperature",'Pressure: real profile vs one scale height','Ozone and high-energy sunlight heat different layers.','1. Change the surface temperature, ozone or solar activity and watch the layer it heats.<br>2. Launch the probe or drag the altitude line.<br>3. Compare the real pressure with a single scale height.','A warmer surface raises the tropopause: about 17 km in the tropics, 8 km over the poles. Ozone absorbing solar UV warms the stratosphere; with less ozone the warm layer shrinks and more UV reaches the ground. Solar EUV and X-rays heat the thin thermosphere: about 700 K at solar minimum, 1400 K at maximum. The mesopause near 86 km is the coldest air on Earth.','US Standard Atmosphere 1976 is the reference. The surface-temperature and ozone controls are schematic: the troposphere keeps the standard 6.5 K/km lapse rate from the chosen surface temperature, and the ozone control scales the standard profile warming above a straight no-ozone line between 11 and 86 km. Solar activity sets T∞ in the standard thermosphere formulas. Pressure follows hydrostatic balance with constant mean molecular mass below 86 km.'];
