const {K}=model,$=id=>document.getElementById(id),C={amber:'#ffcc66',cyan:'#56c7d9',magenta:'#ee65be',purple:'#a99bff',coral:'#ff7f66',green:'#56dc72',muted:'#979ea6',text:'#e7e9eb',grid:'rgba(151,158,166,.20)',bg:'#0d1015'},P=Math.PI;
const S={albedo:{planet:'Mercury',r:.387,A:.088,mode:'slow'},scale:{body:'Earth',...model.ATM_BODIES[0],dz:.3,z1:0,log:false},layers:{extend:false,Tinf:1000,heating:true,z:0},magneto:{n:5,v:400,bow:true,belts:true,arrows:true,tilt:false,playing:false}};
let tab='albedo',boxes=[],subBoxes=[],markers=[],fieldGeometry=[],raf=0,phase=0,last=0;const params=new URLSearchParams(location.search),embed=params.get('embed')==='1',main=$('mainCanvas'),sub=$('subCanvas');
const fmt=x=>Number.isFinite(x)?Number(x.toPrecision(3)).toLocaleString('en-US',{maximumFractionDigits:6}):'—';
const meta={albedo:['Sunlight in, infrared out','Temperature vs distance','Sunlight intercepted by a planet is reflected or emitted as infrared.','1. Choose a planet or adjust its distance and albedo.<br>2. Compare slow and fast heat transport.<br>3. Compare computed and measured temperatures.','Mercury reaches about 694 K at perihelion. Spreading heat lowers temperature by √2. Venus is warmed by its greenhouse effect; giant planets can emit internal heat.','Blackbody balance with uniform Bond albedo. The cold night side represents no heat storage. Bond albedos from Wikipedia, “Albedo”; measured temperatures are standard values.'],scale:['Hydrostatic equilibrium','Pressure falls by e every scale height','Pressure below the parcel supports its weight.','1. Choose a body.<br>2. Adjust temperature, molecular weight or gravity.<br>3. Move and resize the parcel.','Hotter or lighter gas and weaker gravity increase scale height. Pressure falls by a factor e each H.','Isothermal ideal gas with constant gravity and composition. Giant-planet pressures refer to the 1-bar level.'],layers:['Temperature vs height (US Standard Atmosphere 1976)','Pressure: real profile vs one scale height','Ozone and high-energy sunlight heat different layers.','1. Move the altitude cursor.<br>2. Show heating and extend the profile.<br>3. Change solar activity.','Weather occurs in the troposphere, which cools 6.5 K per km. Ozone warms the stratosphere, making it stable and spreading clouds into layers. The mesopause near 86 km reaches 187 K; EUV and X-rays heat the thermosphere to about 1000 K depending on solar activity. Cold air aloft makes pressure at 86 km ten times lower than an 8.4 km exponential.','US Standard Atmosphere 1976 uses geopotential altitude and piecewise-linear temperature below 86 km, standard thermosphere formulas above, and adjustable upper temperature. Hydrostatic pressure assumes constant molecular mass and is modelled only below 86 km, where air is well mixed.'],magneto:["Earth's magnetosphere (noon–midnight plane)",'Pressure balance at the nose','The solar wind compresses the dayside magnetic field.','1. Choose a wind or adjust density and speed.<br>2. Toggle the shock, belts and field direction.<br>3. Compare the pressure curves.','Magnetic pressure falls as r⁻⁶: doubling wind pressure moves the nose inward by about 12%. A CME at 30 cm⁻³ and 800 km/s pushes it to about 6 Earth radii, inside geostationary orbit. A compass points north because geographic north is a magnetic south pole.','A dipole with equatorial surface field 0.31 G; typical surface values range from 0.25 to 0.65 G. Boundary current doubles the field. Magnetopause shape follows Shue et al. (1997); tail and compression are schematic.']};
const formulas={albedo:[[String.raw`A=\dfrac{\text{reflected}}{\text{incident}}`],[String.raw`F=\sigma T^4`,String.raw`\lambda_{max}=\dfrac{2.898\times10^{-3}\ \text{m K}}{T}`],[String.raw`T_{ss}=T_\odot\sqrt{R_\odot/r}\,(1-A)^{1/4}`,String.raw`=394(1-A)^{1/4}r_{AU}^{-1/2}\ \text{K}`],[String.raw`\pi R^2(1-A)F=4\pi R^2\sigma T_{eq}^4`,String.raw`\Rightarrow T_{eq}=279(1-A)^{1/4}r_{AU}^{-1/2}\ \text{K}`]],scale:[[String.raw`F_1=F_2+mg`,String.raw`m=\rho A\Delta r`],[String.raw`\dfrac{dP}{dr}=-\rho g`],[String.raw`P=nkT,\quad n=\dfrac{\rho}{\mu m_H}`,String.raw`\Rightarrow\dfrac{dP}{P}=-\dfrac{\mu m_Hg}{kT}\,dr`],[String.raw`P=P_0e^{-z/H}`,String.raw`H=\dfrac{kT}{\mu m_Hg}=\dfrac{P}{\rho g}`]],layers:[[String.raw`\dfrac{dP}{dz}=-\dfrac{\mu m_Hg}{kT(z)}P`],[String.raw`dT/dz\approx-6.5\ \text{K/km}`],[String.raw`H(z)=\dfrac{kT(z)}{\mu m_Hg}`],[String.raw`\text{UV }(200\text{–}300\ \text{nm})+\mathrm{O_3}\to\text{stratosphere}`,String.raw`\text{EUV, X-rays}+\mathrm{O,O_2,N_2}\to\text{thermosphere}`]],magneto:[[String.raw`B=B_0(R_\oplus/r)^3\sqrt{1+3\sin^2\lambda}`],[String.raw`p_B=\dfrac{B^2}{2\mu_0}`,String.raw`p_{sw}=\rho v^2`],[String.raw`\dfrac{(2B)^2}{2\mu_0}=\rho v^2`,String.raw`r_0=R_\oplus(2B_0^2/\mu_0\rho v^2)^{1/6}`],[]]};

function readouts(){let s=S[tab];if(tab==='albedo'){let p=model.PLANETS.find(p=>p.name===s.planet)||model.PLANETS[0],ss=model.Tss(s.r,s.A),eq=model.Teq(s.r,s.A);return {flux:model.flux(s.r),absorbed:(1-s.A)*model.flux(s.r),Tss:ss,Teq:eq,measured:s.mode==='slow'?p.measuredSS:p.measuredEq,peakUm:model.wienPeak(s.mode==='slow'?ss:eq)*1e6}}if(tab==='scale'){let H=model.scaleHeight(s.T,s.mu,s.g),p=model.parcel(s.z1*H,s.dz*H,s.P0,H,s.g);return {H_km:H/1000,P1:p.F1,P2:p.F2,weight:p.weight,mass:p.mass,ratio:p.F1/s.P0}}if(tab==='layers')return {altitude_km:s.z,T:model.us76T(s.z,s.Tinf),C:model.us76T(s.z,s.Tinf)-273.15,P:model.us76P(s.z),fraction:model.us76P(s.z)/101325,H_km:model.localScaleHeight(s.z,s.Tinf)};let r=model.standoff(s.n,s.v);return {pdyn_nPa:model.pdyn(s.n,s.v)*1e9,r0_RE:r,r0_km:r*K.R_E/1000,B_equator:K.B_EQ,B_pole:2*K.B_EQ,B_boundary_nT:2*K.B_EQ*r**-3*1e9,GEO_inside:r>=6.6?1:0}}
const chip=(label,key,val,active)=>`<button class="chip ${active?'active':''}" data-key="${key}" data-value="${val}">${label}</button>`;
const rangeControl=(label,key,min,max,step,val,unit='')=>{let logarithmic=key==='r'||key==='n',pos=logarithmic?Math.log(val/min)/Math.log(max/min)*1000:val;return `<div class="field"><label class="field-label">${label} (${unit})</label><div class="field-row"><input type="range" data-range="${key}" data-scale="${logarithmic?'log':'linear'}" data-min="${min}" data-max="${max}" min="${logarithmic?0:min}" max="${logarithmic?1000:max}" step="${logarithmic?1:step}" value="${pos}"><input class="num-input" type="number" data-num="${key}" min="${min}" max="${max}" step="${step}" value="${val}"></div></div>`};
const toggle=(label,key,on)=>`<label class="field"><input class="toggle" type="checkbox" data-toggle="${key}" ${on?'checked':''}> ${label}</label><br>`;
